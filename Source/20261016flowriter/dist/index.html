// Generator. `focus`: letters to practice. `known`: letters the class already knows
// (blank = all). kind: 'letters' | 'words' | 'sentence'. Returns clean text.
function generateText({ focus = '', known = '', kind = 'words', count = 6, seed = Math.random } = {}){
  const f = [...new Set(focus.replace(/[^A-Za-z]/g, ''))];
  const k = new Set((known || 'abcdefghijklmnopqrstuvwxyz').toLowerCase().replace(/[^a-z]/g, ''));
  f.forEach(c => k.add(c.toLowerCase()));
  const pickN = (arr, n) => { const a = arr.slice(), out = []; while (a.length && out.length < n) out.push(a.splice(Math.floor(seed() * a.length), 1)[0]); return out; };
  if (kind === 'letters') {
    if (!f.length) return '';
    // Zaner-Bloser style drill: each letter alone, then joined three times
    return f.map(c => `${c} ${c}${c}${c}`).join(' ');
  }
  if (kind === 'sentence') {
    const fl = f.map(c => c.toLowerCase());
    const pool = SENTENCE_BANK.filter(s => !fl.length || fl.some(c => s.toLowerCase().includes(c)));
    return pickN(pool.length ? pool : SENTENCE_BANK, Math.max(1, Math.min(3, Math.round(count / 6)))).join(' ');
  }
  const fl = f.map(c => c.toLowerCase());
  const fits = WORD_BANK.filter(w => [...w.toLowerCase()].every(c => k.has(c)));
  const withFocus = fits.filter(w => !fl.length || fl.some(c => w.toLowerCase().includes(c)));
  const words = pickN(withFocus.length ? withFocus : fits, count);
  return words.join(' ');
}

        rec('practice', sc, { seconds: Math.round(60 + r() * 180), gate, bpm: 84 }); t += (5 + r() * 30) * 6e4 + (r() < .4 ? DAY : 0);
        if (t > now) return;
      }

      if (done >= 1 && testable && r() < Math.min(.95, age / 9 + u.effort * .3)){
        const base = clamp(u.skill - .05 + done * .02 + (r() - .5) * .1, .3, .99);
        const letters = [...new Set(l.text.replace(/[^A-Za-z]/g, ''))].map(ch => ({ ch, score: Math.round(clamp(base - (HARD_LETTERS[ch] || 0) * 2 + (r() - .5) * .16, 0, 1) * 1000) / 1000, n: 2, rev: r() < .08 ? 1 : 0 }));

        rec('test', Math.round(sc * 1000) / 1000, { seconds: Math.round(90 + r() * 120), letters, reversed: letters.reduce((a, x) => a + x.rev, 0) });

    });

  });

  db.users.filter(u => u.classId === 'c_p2').slice(0, 5).forEach((u, i) => {
    const l = db.lessons.find(l => l.classId === 'c_p2' && l.preset === 'zb3');
    db.attempts.push({ id: uid('t_'), userId: u.id, lessonId: l.id, mode: 'practice', score: .7 + i * .05, valid: 30, total: 40, reversed: 0, gate: 'hold', bpm: 84, seconds: 140, letters: null, date: now - (3 + i * 5) * 6e4 });

  });
  db.attempts.sort((a, b) => a.date - b.date);
  db.users.forEach(u => { delete u.skill; delete u.effort; });

}

// ---------------------------------------------------------------- persistence (demo only)
let DB;

// ---------------------------------------------------------------- rules
const RULES = {
  teacherPassword: p => p.length >= 8 && !/\s/.test(p),
  studentPassword: p => p.length >= 6 && !/\s/.test(p),
  username: u => /^[a-z0-9_.-]{3,24}$/i.test(u),
  email: e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e),
};
function newCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)]; return DB.classes.some(c => c.code === s) ? newCode() : s; }
const KID_WORDS = ['tiger','piano','comet','maple','river','otter','drum','violin','panda','rocket','lemon','robin','tulip','zebra','banjo','koala'];
// first name + last initial + 2 digits, unique: maya_a27
function uniqueStudentName(name){ const [f, l] = (name || 'student').toLowerCase().replace(/[^a-z ]/g, '').split(' '); let u; do { u = (f || 'student').slice(0, 12) + (l ? '_' + l[0] : '') + (10 + Math.floor(Math.random() * 90)); } while (DB.users.some(x => x.username === u)); return u; }
function kidPassword(){ return pick(Math.random, KID_WORDS) + (10 + Math.floor(Math.random() * 90)); }

// ---------------------------------------------------------------- derived
const userById = id => DB.users.find(u => u.id === id);
const classById = id => DB.classes.find(c => c.id === id);
const lessonById = id => DB.lessons.find(l => l.id === id);
const songById = id => DB.songs.find(s => s.id === id);
const classStudents = cid => DB.users.filter(u => u.role === 'student' && u.classId === cid).sort((a, b) => a.name.localeCompare(b.name));
const lessonsForClass = cid => DB.lessons.filter(l => l.classId === cid).sort((a, b) => b.created - a.created);
const lessonsForStudent = u => !u.classId ? [] : DB.lessons.filter(l => l.classId === u.classId && (!l.studentIds || l.studentIds.includes(u.id))).sort((a, b) => a.created - b.created);
const isCheck = l => !!l && l.kind === 'check';
// In a class set to "one at a time", a lesson opens when every earlier lesson is done (handwriting checks are always open).
function lessonLocked(u, l){
  const c = classById(l.classId); if (!c || !c.sequential || isCheck(l)) return null;
  const before = lessonsForStudent(u).filter(x => !isCheck(x) && x.created < l.created);
  const open = before.find(x => !progress(u.id, x.id).done);
  return open || null;
}
const assignedTo = l => l.studentIds ? classStudents(l.classId).filter(s => l.studentIds.includes(s.id)) : classStudents(l.classId);
// progress on one lesson: the three steps
function progress(userId, lessonId){
  const at = DB.attempts.filter(a => a.userId === userId && a.lessonId === lessonId), chk = isCheck(lessonById(lessonId));
  const demo = at.filter(a => a.mode === 'demo').length, prac = at.filter(a => a.mode === 'practice');
  const test = at.find(a => a.mode === 'test') || null;
  const seconds = at.reduce((s, a) => s + (a.seconds || 0), 0);
  const bestPractice = prac.reduce((b, a) => Math.max(b, a.score || 0), 0);
  const step = test ? 3 : prac.length ? 2 : demo ? 1 : 0;
  return { demo, practice: prac.length, test, done: chk ? !!test : !!(demo && prac.length && test), step: chk && test ? 3 : step, check: chk, seconds, bestPractice, last: at.length ? Math.max(...at.map(a => a.date)) : null, started: at.length > 0 };
}
function studentStats(uid_, from = 0, to = Infinity){
  const at = DB.attempts.filter(a => a.userId === uid_ && a.date >= from && a.date < to);
  const tests = at.filter(a => a.mode === 'test' && !isCheck(lessonById(a.lessonId)));
  return { attempts: at, tests, seconds: at.reduce((s, a) => s + (a.seconds || 0), 0), avgTest: tests.length ? tests.reduce((s, a) => s + a.score, 0) / tests.length : null,
    practice: at.filter(a => a.mode === 'practice').length, reversed: tests.reduce((s, a) => s + (a.reversed || 0), 0) };
}
function lessonCompletion(l){ const kids = assignedTo(l); const done = kids.filter(k => progress(k.id, l.id).done).length; return { done, total: kids.length, pct: kids.length ? done / kids.length : 0 }; }
// per-letter averages from test runs, worst first
function letterReport(attempts){
  const m = new Map();
  attempts.filter(a => a.mode === 'test' && a.letters).forEach(a => a.letters.forEach(x => { const e = m.get(x.ch) || { ch: x.ch, sum: 0, n: 0, rev: 0 }; e.sum += x.score; e.n++; e.rev += x.rev || 0; m.set(x.ch, e); }));
  return [...m.values()].map(e => ({ ch: e.ch, avg: e.sum / e.n, n: e.n, rev: e.rev })).sort((a, b) => a.avg - b.avg);
}

// =====================================================================
// Music: starter songs are synthesized in the browser (so the demo ships
// no audio files), rendered to WAV, and handed to the tracing engine as
// if the user had uploaded them. Uploaded MP3s get their BPM detected
// with the same onset + autocorrelation method the engine uses.
// =====================================================================
const Music = (() => {
  const SR = 22050;
  const PROG = { calm: [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], bright: [[60, 64, 67], [55, 59, 62], [57, 60, 64], [53, 57, 60]], bold: [[52, 55, 59], [48, 52, 55], [50, 54, 57], [47, 50, 54]] };

      const t = t0 + b * spb, bar = Math.floor(b / 4), pos = b % 4, ch = prog[bar % prog.length];
      // drums
      if (style === 'March') { kick(t); if (pos % 2) hit(t, 1800, .12, .5); hit(t + spb * .5, 1800, .06, .22); }

      // chords on bar start

    }
  }

  async function renderSong(song, seconds){

    const NB = 20, bins = win / 2, edges = []; for (let b = 0; b <= NB; b++) edges.push(Math.max(1, Math.min(bins, Math.round(40 * Math.pow(10000 / 40, b / NB) * win / sr))));
    const re = new Float32Array(win), im = new Float32Array(win), prev = new Float32Array(NB), env = new Float32Array(frames);
    for (let f = 0; f < frames; f++){ const o = f * hop; for (let i = 0; i < win; i++){ re[i] = x[o + i] * hann[i]; im[i] = 0; } fft(re, im, cosT, sinT, rev); let flux = 0; for (let b = 0; b < NB; b++){ const a = edges[b], z = Math.max(a + 1, edges[b + 1]); let e = 0; for (let k = a; k < z; k++) e += re[k] * re[k] + im[k] * im[k]; const m = Math.log1p(1000 * Math.sqrt(e / (z - a))); const d = m - prev[b]; if (d > 0) flux += d; prev[b] = m; } env[f] = flux; }
    const w = Math.round(fps * .25), out = new Float32Array(frames), pre = new Float64Array(frames + 1); for (let i = 0; i < frames; i++) pre[i + 1] = pre[i] + env[i];
    for (let i = 0; i < frames; i++){ const a = Math.max(0, i - w), b = Math.min(frames, i + w + 1); const v = env[i] - (pre[b] - pre[a]) / (b - a); out[i] = v > 0 ? v : 0; }
    return { env: out, fps };
  }
  function comb(env, period){ let best = -1; const N = env.length, P = Math.ceil(period); for (let ph = 0; ph < P; ph++){ let s = 0, c = 0; for (let t = ph; t < N - 1; t += period){ const i = Math.floor(t), f = t - i; s += env[i] * (1 - f) + env[i + 1] * f; c++; } s /= Math.max(1, c); if (s > best) best = s; } return best; }
  async function detectBpm(file){
    const m = file.name.match(/(\d{2,3}(?:\.\d+)?)\s*bpm/i); if (m && +m[1] >= 20 && +m[1] <= 400) { let duration = null; try { const c = new OfflineAudioContext(1, 1, 22050); duration = (await c.decodeAudioData(await file.arrayBuffer())).duration; } catch (e) {} return { bpm: +m[1], from: 'name', duration }; }
    const ctx = new OfflineAudioContext(1, 1, 22050);
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    const { env, fps } = envelope(buf, 60), N = env.length; if (N < fps * 4) return { bpm: 100, from: 'default', duration: buf.duration };
    const minL = Math.floor(fps * 60 / 210), maxL = Math.ceil(fps * 60 / 50), ac = new Float32Array(2 * maxL + 2);
    for (let l = minL; l <= 2 * maxL + 1 && l < N; l++){ let s = 0; for (let i = 0; i + l < N; i++) s += env[i] * env[i + l]; ac[l] = s / (N - l); }
    const prior = b => Math.exp(-.5 * Math.pow(Math.log2(b / 115) / .9, 2));
    let bestL = minL, best = -1; for (let l = minL; l <= maxL; l++){ const sc = (ac[l] + .5 * (ac[2 * l] || 0)) * prior(60 * fps / l); if (sc > best){ best = sc; bestL = l; } }
    let bpm0 = 60 * fps / bestL, pickv = -1, pickb = bpm0;
    [1, 2, .5, 1.5, 2 / 3].forEach(f => { const c = bpm0 * f; if (c < 50 || c > 210) return; for (let b = c - 1.5; b <= c + 1.5; b += .25){ const v = comb(env, 60 * fps / b) * prior(b); if (v > pickv){ pickv = v; pickb = b; } } });
    let bpm = Math.round(pickb * 10) / 10; if (Math.abs(bpm - Math.round(bpm)) < .3) bpm = Math.round(bpm);
    return { bpm, from: 'audio', duration: buf.duration };
  }
  return { starterFile, preview, stopPreview, detectBpm, playing: () => liveId };
})();

// =====================================================================
// FloWriter backend adapter (Supabase).
// Loads only when config.js sets window.FLOWRITER_CONFIG = { url, anonKey }.
// On sign-in it pulls everything this account may see into the in-memory
// `DB` the views read, then mirrors each write to Postgres. Teachers see new
// student work when the dashboard refreshes (every minute, or the refresh
// button). Row level security in schema.sql decides who can see what.
// =====================================================================
const Backend = (() => {
  const CFG = (typeof window !== 'undefined' && window.FLOWRITER_CONFIG) || null;
  // the unedited example config (YOUR-PROJECT / YOUR-ANON-PUBLIC-KEY) means "no backend yet": stay on demo data
  const enabled = !!(CFG && CFG.url && CFG.anonKey && !/YOUR-/.test(CFG.url + CFG.anonKey));
  const STUDENT_DOMAIN = (CFG && CFG.studentEmailDomain) || 'students.flowriter.app';
  const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  let sb = null, failures = 0;

  const ms = v => v ? new Date(v).getTime() : null;
  const fromProfile = r => ({ id: r.id, username: r.username, role: r.role, name: r.name, school: r.school, classId: r.class_id, attested: ms(r.attested), joined: ms(r.joined), lastSeen: ms(r.last_seen), handed: r.handed || 'right' });
  const fromClass = r => ({ id: r.id, teacherId: r.teacher_id, name: r.name, code: r.code, school: r.school, archived: r.archived, message: r.message || '', sequential: !!r.sequential, created: ms(r.created) });
  const fromLesson = r => ({ id: r.id, classId: r.class_id, title: r.title, preset: r.preset, text: r.text, songId: r.song_id, mult: +r.mult, bps: r.bps, rest: r.rest, difficulty: r.difficulty, theme: r.theme || '', due: ms(r.due), studentIds: r.student_ids, kind: r.kind || 'lesson', created: ms(r.created) });
  const fromAttempt = r => ({ id: r.id, userId: r.user_id, lessonId: r.lesson_id, mode: r.mode, score: r.score == null ? null : +r.score, valid: r.valid, total: r.total, reversed: r.reversed, gate: r.gate, bpm: r.bpm == null ? null : +r.bpm, seconds: r.seconds, letters: r.letters, date: ms(r.created) });
  const fromSong = r => ({ id: r.id, ownerId: r.owner_id, title: r.title, artist: r.artist, bpm: +r.bpm, offset: r.offset == null ? null : +r.offset, duration: r.duration == null ? null : +r.duration, path: r.path, kind: r.kind, created: ms(r.created) });
  const toLesson = l => ({ id: l.id, class_id: l.classId, title: l.title, preset: l.preset || null, text: l.text, song_id: l.songId || null, mult: l.mult, bps: l.bps, rest: l.rest, difficulty: l.difficulty, theme: l.theme || '', due: l.due ? new Date(l.due).toISOString() : null, student_ids: l.studentIds && l.studentIds.length ? l.studentIds : null, kind: l.kind || 'lesson' });

  function warn(e, what){
    failures++; console.error('[flowriter] ' + what, e);
    if (failures <= 3 && typeof toast === 'function') toast(`Couldn’t save ${what} to the server. Check the connection and try again.`, 5000);
  }
  const push = (p, what) => Promise.resolve(p).then(r => { if (r && r.error) warn(r.error, what); return r; }, e => warn(e, what));
  const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };

  function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
  async function connect(){
    if (sb) return sb;
    if (!window.supabase) await loadScript(SUPABASE_JS);
    sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    // a teacher's "reset password" email link lands here with a recovery session
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { state.recovery = true; go('reset'); } });
    return sb;
  }
  // Supabase returns at most 1000 rows per request, so read in pages.
  async function fetchAll(table, cols = '*', order = 'created'){
    const out = [];
    for (let from = 0; ; from += 1000){
      const r = await sb.from(table).select(cols).order(order, { ascending: true }).range(from, from + 999);
      if (r.error) throw new Error(r.error.message);
      out.push(...r.data); if (r.data.length < 1000) return out;
    }
  }

  // ---------- outbox: a run is kept on this device until the server has it ----------
  const OUTBOX = 'flowriter-outbox';
  const readBox = () => { try { return JSON.parse(localStorage.getItem(OUTBOX) || '[]'); } catch (e) { return []; } };
  const writeBox = b => { try { localStorage.setItem(OUTBOX, JSON.stringify(b)); } catch (e) { try { localStorage.setItem(OUTBOX, JSON.stringify(b.map(x => ({ ...x, trace: null })))); } catch (e2) {} } };
  let flushing = false, retryTimer = null;
  function saveState(n){ dispatchEvent(new CustomEvent('fw-save', { detail: { pending: n } })); }
  async function flush(){
    if (flushing || !sb) return; flushing = true;
    let box = readBox();
    for (const row of box.slice()){
      const r = await sb.from('attempts').insert(row).then(x => x, e => ({ error: e }));
      const dup = r.error && (r.error.code === '23505' || /duplicate/i.test(r.error.message || ''));
      if (!r.error || dup) { box = readBox().filter(x => x.id !== row.id); writeBox(box); }
      else { console.error('[flowriter] saving a run', r.error); if (r.error.code === '42501') { box = readBox().filter(x => x.id !== row.id); writeBox(box); } else break; }
    }
    flushing = false; box = readBox(); saveState(box.length);
    clearTimeout(retryTimer); if (box.length) retryTimer = setTimeout(flush, 15000);
  }
  addEventListener('online', () => flush());

  async function hydrate(userId){
    const q = (t, cols = '*') => sb.from(t).select(cols);
    const [profiles, classes, lessons, attemptRows, songs, admin] = await Promise.all([
      q('profiles'), q('classes'), q('lessons'),
      fetchAll('attempts', 'id,user_id,lesson_id,mode,score,valid,total,reversed,gate,bpm,seconds,letters,created'),
      q('songs'), sb.rpc('is_admin'),
    ]);
    [profiles, classes, lessons, songs].forEach(must);
    const attempts = { data: attemptRows };
    DB = {
      v: 1,
      users: profiles.data.map(fromProfile),
      classes: classes.data.map(fromClass),
      lessons: lessons.data.map(fromLesson),
      attempts: attempts.data.map(fromAttempt),
      songs: [...STARTER_SONGS.map(s => ({ ...s })), ...songs.data.map(fromSong).filter(s => s.kind === 'upload')],
      feedback: [],
    };
    // runs still waiting on this device count as done, so a test is never offered twice
    readBox().filter(r => r.user_id === userId && !DB.attempts.some(a => a.id === r.id)).forEach(r => DB.attempts.push(fromAttempt(r)));
    const me = DB.users.find(u => u.id === userId);
    if (!me) throw new Error('This account has no FloWriter profile yet.');
    me.admin = !!(admin && admin.data);
    if (me.admin) { const f = await sb.from('feedback').select('*').order('created', { ascending: false }).limit(500); if (!f.error) DB.feedback = f.data.map(x => ({ id: x.id, userId: x.user_id, role: x.role, rating: x.rating, body: x.body, page: x.page, date: ms(x.created) })); }
    if (me.role === 'teacher') live(); flush();
    push(sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', userId), 'your sign-in time');
    return me;
  }

  // live updates: new runs from students appear on teacher pages without a refresh
  let channel = null;
  function live(){
    if (channel) return;
    channel = sb.channel('fw-attempts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attempts' }, ({ new: r }) => {
      if (!r || DB.attempts.some(a => a.id === r.id)) return;
      DB.attempts.push(fromAttempt(r)); if (r.trace) RUNTIME.traces[r.id] = r.trace;
      const u = userById(r.user_id); if (u) u.lastSeen = Date.now();
      dispatchEvent(new Event('fw-data'));
    }).subscribe();
  }
  // a second client that never touches this browser's sign-in, for making student accounts
  let side = null;
  const sideClient = () => side || (side = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'fw-side' } }));
  async function uniqueUsername(base){
    base = (base || 'teacher').toLowerCase().replace(/[^a-z0-9_.-]/g, '').slice(0, 18) || 'teacher';
    for (let i = 0; i < 6; i++){ const u = i ? base + Math.floor(10 + Math.random() * 990) : base; const { data } = await sb.rpc('username_taken', { u }); if (!data) return u; }
    return base + Date.now().toString(36);
  }

  function install(){
    api.demo = false;
    api.login = async (id, password) => {
      let email = id.trim();
      if (!email.includes('@')) {
        const { data } = await sb.rpc('email_for_username', { u: email });
        if (!data) throw new Error('No account with that username or email.');
        email = data;
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/Invalid/i.test(error.message) ? 'That password doesn’t match this account.' : error.message);
      return hydrate(data.user.id);
    };
    api.signupTeacher = async f => {
      if (!f.name) throw new Error('Enter your name as students know it, like Ms. Rivera.');
      if (!RULES.email(f.email)) throw new Error('Enter a valid email address.');
      if (!RULES.teacherPassword(f.password)) throw new Error('Passwords need at least 8 characters and no spaces.');
      if (!f.attest) throw new Error('Confirm that your school allows students to use FloWriter.');
      const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.password });
      if (error) throw new Error(/registered|already/i.test(error.message) ? 'An account already uses that email.' : error.message);
      if (!data.session) throw new Error('Check your email to confirm the account, then log in.');
      const username = await uniqueUsername(f.email.split('@')[0]);
      const pe = await sb.from('profiles').insert({ id: data.user.id, username, role: 'teacher', name: f.name, school: f.school || null, attested: new Date().toISOString() });
      if (pe.error) { await sb.auth.signOut(); throw new Error(/row-level|policy/i.test(pe.error.message) ? 'This email isn’t on the pilot’s teacher list. Ask the FloWriter team to add it.' : pe.error.message); }
      must(await sb.from('classes').insert({ teacher_id: data.user.id, name: 'My class', code: newCode(), school: f.school || null }));
      return hydrate(data.user.id);
    };
    api.lookupClass = async code => {
      const { data } = await sb.rpc('class_for_code', { c: (code || '').trim() });
      return data && data[0] ? data[0] : null;
    };
    api.joinClass = async f => {
      const username = (f.username || '').trim().toLowerCase();
      if (!f.name) throw new Error('Type your first name and the first letter of your last name.');
      if (!RULES.username(username)) throw new Error('Usernames are 3 to 24 letters or numbers, with no spaces.');
      if (!RULES.studentPassword(f.password)) throw new Error('Passwords need at least 6 characters and no spaces.');
      const cls = await api.lookupClass(f.code);
      if (!cls) throw new Error('That class code doesn’t match an open class. Check the code with your teacher.');
      const { data: taken } = await sb.rpc('username_taken', { u: username });
      if (taken) throw new Error('That username is taken. Try adding a number.');
      // students have no email: the account uses a generated address that never receives mail
      const { data, error } = await sb.auth.signUp({ email: `${username}@${STUDENT_DOMAIN}`, password: f.password });
      if (error) throw new Error(/registered|already/i.test(error.message) ? 'That username is taken. Try adding a number.' : error.message);
      if (!data.session) throw new Error('Student accounts need email confirmation turned off in Supabase. See SETUP.md.');
      must(await sb.from('profiles').insert({ id: data.user.id, username, role: 'student', name: f.name, class_id: cls.id }));
      return hydrate(data.user.id);
    };
    api.logout = () => { if (channel) { sb.removeChannel(channel); channel = null; } return sb.auth.signOut(); };
    api.requestReset = async email => {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href.split('#')[0] });
      if (error) throw new Error(error.message);
      return {};
    };
    api.updatePassword = async pw => {
      const { data, error } = await sb.auth.updateUser({ password: pw });
      if (error) throw new Error(error.message);
      state.recovery = false; return hydrate(data.user.id);
    };
    api.updateProfile = patch => {
      Object.assign(state.user, patch);
      const row = {}; if ('name' in patch) row.name = patch.name; if ('school' in patch) row.school = patch.school; if ('handed' in patch) row.handed = patch.handed;
      push(sb.from('profiles').update(row).eq('id', state.user.id), 'your settings');
    };
    api.changeClass = async code => {
      const c = await api.lookupClass(code); if (!c) throw new Error('That code doesn’t match an open class. Check it with your teacher.');
      const { error } = await sb.from('profiles').update({ class_id: c.id }).eq('id', state.user.id); if (error) throw new Error(error.message);
      state.user = await hydrate(state.user.id); return c;
    };
    api.moveStudent = (id, cid) => { userById(id).classId = cid; push(sb.from('profiles').update({ class_id: cid }).eq('id', id), 'the class change'); };
    api.deleteStudent = async id => { const { error } = await sb.rpc('delete_student', { student: id }); if (error) throw new Error(error.message); DB.users = DB.users.filter(u => u.id !== id); DB.attempts = DB.attempts.filter(a => a.userId !== id); return true; };
    api.createStudents = async (cid, names, onEach) => {
      const c = classById(cid), out = [], tmp = sideClient();
      for (const name of names){
        let username = uniqueStudentName(name);
        for (let i = 0; i < 5; i++){ const { data: taken } = await sb.rpc('username_taken', { u: username }); if (!taken) break; username = uniqueStudentName(name); }
        const password = kidPassword();
        const su = await tmp.auth.signUp({ email: `${username}@${STUDENT_DOMAIN}`, password });
        if (su.error) throw new Error(`Couldn’t make an account for ${name}: ${su.error.message}` + (/rate/i.test(su.error.message) ? ' Raise the sign-up rate limit in Supabase (see the launch guide), then add the rest.' : ''));
        if (!su.data.session) throw new Error('Student accounts need email confirmation turned off in Supabase.');
        const pr = await tmp.from('profiles').insert({ id: su.data.user.id, username, role: 'student', name, class_id: cid });
        if (pr.error) throw new Error(pr.error.message);
        await tmp.auth.signOut();
        const u = { id: su.data.user.id, username, role: 'student', name, classId: cid, school: c.school, joined: Date.now(), lastSeen: null, handed: 'right' };
        DB.users.push(u); out.push({ user: u, password }); onEach && onEach(out.length);
      }
      return out;
    };
    api.newPasswords = async ids => { const out = []; for (const id of ids){ const password = kidPassword(); const { error } = await sb.rpc('reset_student_password', { student: id, new_password: password }); if (error) throw new Error(error.message); out.push({ user: userById(id), password }); } return out; };
    api.sendFeedback = async f => { const { error } = await sb.from('feedback').insert({ user_id: state.user.id, role: state.user.role, rating: f.rating || null, body: f.body || null, page: f.page || null }); if (error) throw new Error(error.message); return true; };
    api.setSequential = (cid, on) => { classById(cid).sequential = on; push(sb.from('classes').update({ sequential: on }).eq('id', cid), 'that setting'); };
    api.pendingSaves = () => readBox().length;

    api.recordAttempt = a => {
      if (a.mode === 'test') { const had = DB.attempts.find(x => x.userId === a.userId && x.lessonId === a.lessonId && x.mode === 'test'); if (had) return had; }
      const rec = { id: crypto.randomUUID(), date: Date.now(), ...a }; const trace = rec.trace; delete rec.trace;
      if (trace) RUNTIME.traces[rec.id] = trace;
      DB.attempts.push(rec);
      const row = { id: rec.id, user_id: rec.userId, lesson_id: rec.lessonId, mode: rec.mode, score: rec.score, valid: rec.valid || 0, total: rec.total || 0,
        reversed: rec.reversed || 0, gate: rec.gate || null, bpm: rec.bpm ?? null, seconds: rec.seconds || 0, letters: rec.letters || null, trace: trace || null, created: new Date(rec.date).toISOString() };
      writeBox([...readBox(), row]); saveState(readBox().length); flush();
      return rec;
    };
    api.addSeconds = (attemptId, seconds) => {
      const a = DB.attempts.find(a => a.id === attemptId); if (!a || a.mode === 'test') return;
      a.seconds = (a.seconds || 0) + seconds;
      const box = readBox(), q = box.find(x => x.id === a.id);
      if (q) { q.seconds = a.seconds; writeBox(box); return; }   // not on the server yet: update the queued copy
      push(sb.from('attempts').update({ seconds: a.seconds }).eq('id', a.id), 'practice time');
    };
    api.saveLesson = l => {
      let row;
      if (l.id) { const i = DB.lessons.findIndex(x => x.id === l.id); DB.lessons[i] = row = { ...DB.lessons[i], ...l }; }
      else { row = { ...l, id: crypto.randomUUID(), created: Date.now() }; DB.lessons.push(row); }
      push(sb.from('lessons').upsert(toLesson(row)), 'this lesson');
      return row;
    };
    api.deleteLesson = id => { DB.lessons = DB.lessons.filter(l => l.id !== id); push(sb.from('lessons').delete().eq('id', id), 'that deletion'); };
    api.addClass = (teacher, name) => {
      const c = { id: crypto.randomUUID(), teacherId: teacher.id, name, code: newCode(), school: teacher.school, archived: false, created: Date.now() };
      DB.classes.push(c); push(sb.from('classes').insert({ id: c.id, teacher_id: c.teacherId, name, code: c.code, school: c.school }), 'the new class'); return c;
    };
    api.renameClass = (cid, name) => { classById(cid).name = name; push(sb.from('classes').update({ name }).eq('id', cid), 'the class name'); };
    api.saveClassMessage = (cid, message) => push(sb.from('classes').update({ message }).eq('id', cid), 'the class message');
    api.regenCode = cid => { const c = classById(cid); c.code = newCode(); push(sb.from('classes').update({ code: c.code }).eq('id', cid), 'the new class code'); return c.code; };
    api.archiveClass = (cid, on) => { classById(cid).archived = on; push(sb.from('classes').update({ archived: on }).eq('id', cid), 'that change'); };
    api.removeStudent = id => { userById(id).classId = null; push(sb.from('profiles').update({ class_id: null }).eq('id', id), 'that change'); };
    api.resetStudentPassword = async id => { const pw = kidPassword(); const { error } = await sb.rpc('reset_student_password', { student: id, new_password: pw }); if (error) throw new Error(error.message); return pw; };
    api.addSong = async (s, file) => {
      const me = state.user, id = 'sg_' + crypto.randomUUID().slice(0, 12), path = `${me.id}/${id}.mp3`;
      const up = await sb.storage.from('songs').upload(path, file, { contentType: 'audio/mpeg', upsert: false });
      if (up.error) throw new Error('The MP3 didn’t upload: ' + up.error.message);
      const row = { id, owner_id: me.id, title: s.title, artist: s.artist || null, bpm: s.bpm, offset: s.offset ?? null, duration: s.duration ?? null, path, kind: 'upload' };
      const ins = await sb.from('songs').insert(row); if (ins.error) throw new Error(ins.error.message);
      const song = fromSong({ ...row, created: new Date().toISOString() }); DB.songs.push(song); RUNTIME.songFiles[id] = file; return song;
    };
    api.updateSong = (id, patch) => { const s = songById(id); Object.assign(s, patch); push(sb.from('songs').update({ title: s.title, artist: s.artist, bpm: s.bpm, offset: s.offset }).eq('id', id), 'the song'); };

      if (song.kind === 'starter') return Music.starterFile(song);

  }

  async function boot(){

// ---------- cursive as SVG (wordmark) ----------
function cursiveSVG(text, { xh = 12, stroke = 2.2, cls = '' } = {}){
  const L = Cursive.build(text), pad = stroke + 2;
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  L.strokes.forEach(s => s.pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }));
  const X = u => ((u - minX) * xh + pad).toFixed(1), Y = v => ((maxY - v) * xh + pad).toFixed(1);
  const d = L.strokes.map(s => 'M' + s.pts.map(p => X(p[0]) + ' ' + Y(p[1])).join('L')).join('');
  const w = (maxX - minX) * xh + pad * 2, h = (maxY - minY) * xh + pad * 2;
  return `<svg class="${cls}" viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" role="img" aria-label="${esc(text)}"><path d="${d}" stroke-width="${stroke}"/></svg>`;
}
const wordmark = () => cursiveSVG('FloWriter', { xh: 11, stroke: 2.4, cls: 'wordmark' });

// Routes are plain hash tokens with an optional ?query, e.g. #/class?id=c_p2&tab=students
function parseHash(){ const h = location.hash.replace(/^#\/?/, ''); const [path, q] = h.split('?'); return { path: path || '', q: new URLSearchParams(q || '') }; }

const ROUTES = {};
let cleanup = [], keepScroll = false;
function route(path, opts, view, after){ ROUTES[path] = { ...opts, view, after }; }
function render(){
  cleanup.forEach(f => { try { f(); } catch (e) {} }); cleanup = [];
  if (typeof Music !== 'undefined') Music.stopPreview();
  const { path, q } = parseHash(); const r = ROUTES[path] || ROUTES[''];
  const u = state.user;
  if (r.auth && !u) { go('login'); return; }
  if (r.auth && r.auth !== 'any' && u.role !== r.auth) { go(home(u)); return; }

  $('#app').innerHTML = r.bare ? body : appFrame(r.nav, body);

}

// ---------- components ----------
function delta(now, prev, { invert = false, unit = '%' } = {}){
  if (prev == null || now == null || (!prev && !now)) return '<span class="delta flat">–</span>';
  if (!prev) return '<span class="delta up">new</span>';
  const ch = (now - prev) / Math.abs(prev), up = ch > .005, down = ch < -.005, good = invert ? down : up;
  return `<span class="delta ${up || down ? (good ? 'up' : 'down') : 'flat'}">${up ? '↑' : down ? '↓' : ''} ${Math.abs(Math.round(ch * 100))}${unit}</span>`;
}

}

// Line chart: this period vs the previous one (dashed), drawn to scale.
const CHARTS = [];
function lineChart(spec){ const id = 'ch' + CHARTS.length; CHARTS.push(spec); return `<div class="chart-wrap" data-chart="${CHARTS.length - 1}" id="${id}"></div>`; }
function mountCharts(){
  $$('[data-chart]').forEach(el => {
    const spec = CHARTS[+el.dataset.chart]; if (!spec) return;
    const draw = () => {
      const W = Math.max(280, el.clientWidth), H = spec.h || 220, L = 40, R = 12, T = 14, B = 28, iw = W - L - R, ih = H - T - B;
      const n = spec.labels.length, all = [...spec.now, ...(spec.prev || [])], max = niceMax(Math.max(1, ...all));
      const x = i => L + (n === 1 ? iw / 2 : i * iw / (n - 1)), y = v => T + ih - v / max * ih;
      const ticks = [0, .25, .5, .75, 1].map(f => f * max);
      const path = arr => arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
      el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.label)}">
        <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${spec.fmt ? spec.fmt(t) : Math.round(t)}</text>`).join('')}</g>
        ${spec.labels.map((l, i) => { if (i % 2) return ''; const half = iw / (2 * Math.max(1, n - 1)), a = Math.max(L, x(i) - half), b = Math.min(W - R, x(i) + half); return `<rect class="band" x="${a}" y="${T}" width="${b - a}" height="${ih}"/>`; }).join('')}
        ${spec.labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('')}
        <path class="area" d="${path(spec.now)}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z"/>
        ${spec.prev ? `<path class="prev" d="${path(spec.prev)}"/>${spec.prev.map((v, i) => `<circle class="ptp" cx="${x(i)}" cy="${y(v)}" r="3"/>`).join('')}` : ''}
        <path class="now" d="${path(spec.now)}"/>${spec.now.map((v, i) => `<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 5 : 4}"/>`).join('')}
        <line class="cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--blue)" stroke-width="1.5" style="display:none"/></svg><div class="tip" hidden></div>`;
      const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross');

// Month activity calendar from attempt seconds. Goal: 10 minutes a day.
function activityCalendar(attempts, monthOffset = 0){
  const now = new Date(), m = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1), first = new Date(m); first.setDate(1 - m.getDay());
  const byDay = new Map(); attempts.forEach(a => { const k = dayStart(a.date); byDay.set(k, (byDay.get(k) || 0) + (a.seconds || 0)); });
  let cells = '';
  for (let i = 0; i < 42; i++){ const d = new Date(first); d.setDate(first.getDate() + i); const k = d.getTime(), s = byDay.get(k) || 0;
    if (i >= 35 && d.getMonth() !== m.getMonth()) break;
    cells += `<span class="d ${d.getMonth() !== m.getMonth() ? 'other' : ''} ${s >= 600 ? 'hi' : s > 0 ? 'lo' : ''} ${k === dayStart(Date.now()) ? 'today' : ''}" title="${fmtShort(k)}: ${fmtMin(s)}">${d.getDate()}</span>`; }
  // streak: consecutive weeks (ending this week) with at least one active day
  let weeks = 0; for (let w = 0; w < 52; w++){ const end = dayStart(Date.now()) - (new Date().getDay() - 6) * DAY - w * 7 * DAY; let any = false; for (let d = 0; d < 7; d++) if (byDay.get(end - d * DAY)) any = true; if (any) weeks++; else break; }
  return { html: `<div class="cal">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<span class="dow">${d}</span>`).join('')}${cells}</div>`,
    title: m.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }), weeks, byDay };
}
function recentDays(byDay, n = 5){
  const days = [...byDay.entries()].filter(([, s]) => s > 0).sort((a, b) => b[0] - a[0]).slice(0, n);
  const max = Math.max(600, ...days.map(d => d[1]));
  return days.length ? `<div class="recent">${days.map(([k, s]) => `<div class="r"><span>${new Date(k).toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' })}</span><span class="bar"><i style="width:${s / max * 100}%"></i></span><span class="num" style="text-align:right">${Math.round(s / 60)}m</span></div>`).join('')}</div>` : '<p class="note">No writing time yet.</p>';
}

// Letter grid: each letter drawn in cursive with its average score.
function letterGrid(report, limit = 12){
  if (!report.length) return '<p class="note">Letter scores appear after the first test.</p>';
  return `<div class="letters">${report.slice(0, limit).map(r => `<div class="lt ${r.avg < .7 ? 'lo' : r.avg < .85 ? 'mid' : 'hi'}" title="${esc(r.ch)}: ${pct(r.avg)} average across ${r.n} test${r.n > 1 ? 's' : ''}${r.rev ? `, ${r.rev} wrong-direction stroke${r.rev > 1 ? 's' : ''}` : ''}"><canvas width="104" height="104" data-glyph="${esc(r.ch)}"></canvas><span class="s">${pct(r.avg)}</span>${r.rev ? `<div class="note" style="font-size:11px">↺ ${r.rev}</div>` : ''}</div>`).join('')}</div>`;
}
function paintGlyphs(root = document){
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#222';
  $$('canvas[data-glyph]', root).forEach(c => { const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height);
    const L = Cursive.build(c.dataset.glyph); let minX = 1e9, maxX = -1e9; L.strokes.forEach(s => s.pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); }));
    const xh = 26, ox = (c.width - (maxX - minX) * xh) / 2 - minX * xh, oy = 70;
    g.strokeStyle = ink; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
    L.strokes.forEach(s => { g.beginPath(); s.pts.forEach((p, i) => i ? g.lineTo(ox + p[0] * xh, oy - p[1] * xh) : g.moveTo(ox + p[0] * xh, oy - p[1] * xh)); g.stroke(); }); });
}
// Model text on ruled paper into a canvas element (lesson previews).
function paintPreview(canvas, text, { xh = 26, maxLines = 3 } = {}){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const w = canvas.clientWidth || 520, dpr = window.devicePixelRatio || 1;
  const L = Cursive.build(cleanText(text) || 'hello', (w - 28) / xh - .8), lines = Math.min(maxLines, L.lines);
  const h = Cursive.height(lines, xh);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); canvas.style.height = h + 'px';
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = v('--surface'); g.fillRect(0, 0, w, h);
  g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip();
  Cursive.drawModel(g, cleanText(text) || 'hello', { w, xh, ink: v('--ink'), rule: v('--rule'), rule2: v('--rule-soft'), line: 2.2 });
  g.restore();
  return L;
}

// ---------- the tracing engine, embedded ----------
// cfg: { word, title, bpm, bps, rest, tol, skin, role, progress } ; song: a song row (or null)
function mountEngine(el, cfg, song, mult, on){
  const ch = 'c' + Math.random().toString(36).slice(2);
  el.innerHTML = `<div class="loading" id="engineLoading"><span id="loadingMsg">Sharpening pencils<span class="dots"></span></span></div><iframe title="Writing page" allow="autoplay"></iframe>`;
  const fr = el.querySelector('iframe');
  const full = { ...cfg, ch, theme: currentTheme(), bpm: song ? song.bpm * mult : (cfg.bpm || 84), debug: !!window.__FW_DEBUG, handed: state.user && state.user.handed || 'right' };
  const inject = `<script>window.__FW=${JSON.stringify(full).replace(/</g, '\\u003c')}<\/script>`;
  fr.srcdoc = ENGINE.replace('</head>', inject + '</head>');
  const send = m => fr.contentWindow && fr.contentWindow.postMessage({ fwShell: 1, ...m }, '*');
  const doneLoading = () => { const l = el.querySelector('#engineLoading'); l && l.remove(); };
  const onMsg = async e => {
    const m = e.data; if (!m || !m.fw || m.ch !== ch) return;
    if (m.type === 'active' || m.type === 'run') bumpActivity();
    if (m.type === 'h') fr.style.height = Math.max(520, m.h) + 'px';
    else if (m.type === 'ready') {
      if (!song) { doneLoading(); return; }
      $('#loadingMsg', el) && ($('#loadingMsg', el).innerHTML = `Tuning up “${esc(song.title)}”<span class="dots"></span>`);
      try { const file = await api.songFile(song); if (!file) throw new Error('missing'); send({ track: file, name: song.title, bpm: song.bpm * mult, baseBpm: song.bpm, offset: song.offset ?? null }); }
      catch (err) { doneLoading(); toast('Couldn’t load the song, so the built-in beat is playing.'); }
    }
    else if (m.type === 'trackReady' || m.type === 'trackFail') { doneLoading(); if (m.type === 'trackFail') toast('Couldn’t play the song, so the built-in beat is playing.'); }
    else on && on(m);
  };
  addEventListener('message', onMsg); cleanup.push(() => removeEventListener('message', onMsg));
  const onTheme = () => send({ theme: currentTheme() }); addEventListener('fw-theme', onTheme); cleanup.push(() => removeEventListener('fw-theme', onTheme));
  return { send };
}

// The scroll intro: ink blots splash onto the page as you scroll, then fly into the strokes of "FloWriter".
// Everything is a function of scroll progress p (0 at the top of the section, 1 when it ends), so scrolling back rewinds it.
function inkIntro(){
  const sec = $('#inkIntro'), c = $('#inkCanvas'); if (!sec || !c) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const flat = []; Cursive.build('FloWriter').strokes.forEach((s, si) => s.pts.forEach(p => flat.push([p[0], p[1], si])));
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9; flat.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
  const r = rng(7), N = 130, A = .42, FLY = .3, DUR = .14; // splash until A; blot i flies from A + FLY*i/N for DUR
  const blots = Array.from({ length: N }, (_, i) => ({ sx: .05 + r() * .9, sy: .14 + r() * .74, R: .5 + r() * 1.1, at: -.03 + r() * (A - .08),
    target: Math.round((i + .5) / N * (flat.length - 1)), tone: r() < .14 ? 'red' : r() < .2 ? 'teal' : 'ink',
    shape: Array.from({ length: 10 }, () => .8 + r() * .4), drops: Array.from({ length: 2 + Math.floor(r() * 4) }, () => ({ a: r() * 6.283, d: 1.3 + r() * 1.4, s: .1 + r() * .22 })) }));
  const k01 = v => Math.max(0, Math.min(1, v)), ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
  const back = t => 1 + 2.7 * (t - 1) ** 3 + 1.7 * (t - 1) ** 2; // overshoot: the splat
  const blob = (g, x, y, rad, shape) => { // a lumpy circle: a smooth curve through the midpoints of uneven vertices
    const P = shape.map((m, j) => { const a = j / shape.length * 6.283; return [x + Math.cos(a) * rad * m, y + Math.sin(a) * rad * m]; }), M = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    g.beginPath(); g.moveTo(...M(P[P.length - 1], P[0])); P.forEach((p, j) => g.quadraticCurveTo(p[0], p[1], ...M(p, P[(j + 1) % P.length]))); g.fill(); };
  let raf = 0;
  const draw = () => {
    raf = 0;
    const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1; if (!w || !h) return;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim(), col = { ink: v('--ink'), red: v('--red'), teal: v('--blue') };
    const p = reduce ? 1 : k01(-sec.getBoundingClientRect().top / Math.max(1, sec.offsetHeight - h));
    const xh = Math.min(w * .84 / (maxX - minX), h * .19), ox = (w - (maxX - minX) * xh) / 2 - minX * xh, mid = (minY + maxY) / 2;
    const X = u => ox + u * xh, Y = y => h * .5 + (mid - y) * xh, sw = Math.max(3, xh * .12), bs = Math.min(w, h) * .03;
    // handwriting guide lines fade in as the blots start to gather
    g.globalAlpha = k01((p - A + .08) / .12) * .9; g.strokeStyle = v('--rule'); g.lineWidth = 1.2;
    [[0, []], [1, [7, 7]]].forEach(([y, d]) => { g.setLineDash(d); g.beginPath(); g.moveTo(w * .04, Y(y)); g.lineTo(w * .96, Y(y)); g.stroke(); }); g.setLineDash([]); g.globalAlpha = 1;
    // the line, written up to the last blot that has landed
    const upto = k01((p - A - DUR) / FLY) * (flat.length - 1);
    g.strokeStyle = col.ink; g.lineWidth = sw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
    for (let i = 0; i <= upto && i < flat.length; i++) { const [x, y, si] = flat[i]; i && flat[i - 1][2] === si ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)); }
    g.stroke();
    blots.forEach((b, i) => {
      const a = k01((p - b.at) / .05); if (a <= 0) return;
      const f = k01((p - A - FLY * i / N) / DUR); if (f >= 1) return; // landed: it is part of the line now
      const T = flat[b.target], e = ease(f), x = b.sx * w + (X(T[0]) - b.sx * w) * e, y = b.sy * h + (Y(T[1]) - b.sy * h) * e;
      const rad = b.R * bs * back(a) * (1 - e) + sw / 2 * e;

      b.drops.forEach(d => { g.beginPath(); g.arc(x + Math.cos(d.a) * rad * d.d * (.6 + .4 * a), y + Math.sin(d.a) * rad * d.d * (.6 + .4 * a), rad * d.s * (1 - e), 0, 6.283); g.fill(); });

  };
  const req = () => { if (!raf) raf = requestAnimationFrame(draw); };
  addEventListener('scroll', req, { passive: true }); addEventListener('resize', req);
  cleanup.push(() => { removeEventListener('scroll', req); removeEventListener('resize', req); cancelAnimationFrame(raf); });
  draw();
}

function paintFamilies(){
  const cs = getComputedStyle(document.documentElement), ink = cs.getPropertyValue('--ink').trim();
  $$('canvas[data-fam]').forEach(c => { const w = c.clientWidth, dpr = window.devicePixelRatio || 1, letters = c.dataset.fam.split('');
    const xh = Math.min(18, w / (letters.length * 1.55 + 1)), h = Math.round(xh * 4.1); c.width = w * dpr; c.height = h * dpr; c.style.height = h + 'px';
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.strokeStyle = ink; g.lineWidth = 2.2; g.lineCap = 'round'; g.lineJoin = 'round';
    const base = xh * 2.6; g.save(); g.strokeStyle = cs.getPropertyValue('--rule').trim(); g.lineWidth = 1; g.beginPath(); g.moveTo(0, base); g.lineTo(w, base); g.stroke(); g.setLineDash([4, 4]); g.beginPath(); g.moveTo(0, base - xh); g.lineTo(w, base - xh); g.stroke(); g.restore();
    letters.forEach((ch, i) => { const L = Cursive.build(ch), x0 = 4 + i * (w - 8) / letters.length; L.strokes.forEach(s => { g.beginPath(); s.pts.forEach((p, j) => j ? g.lineTo(x0 + p[0] * xh, base - p[1] * xh) : g.moveTo(x0 + p[0] * xh, base - p[1] * xh)); g.stroke(); }); }); });
}

// The hero: "music" written one stroke per beat at 84 BPM, with a 4-beat count-in.
let heroAudio = null;
function heroAnimation(){
  const c = $('#heroCanvas'); if (!c) return;
  const BPM = 84, spb = 60 / BPM, text = 'music', L = Cursive.build(text), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // beat plan: count-in 4, then each stroke 1 beat, with 1 extra beat to lift for a dot
  const plan = []; let b = 4; L.strokes.forEach((s, i) => { if (i && s.lift) b += 1; plan.push({ s, b0: b }); b += 1; }); const total = b + 3;
  let minX = 1e9, maxX = -1e9; L.strokes.forEach(s => s.pts.forEach(p => { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); }));
  let t0 = performance.now(), raf = 0;
  const draw = () => {
    const w = c.clientWidth, h = Math.round(w * .46), dpr = window.devicePixelRatio || 1;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.height = h + 'px'; }
    const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const xh = Math.min(h / 3.2, (w - 70) / (maxX - minX)), ox = (w - (maxX - minX) * xh) / 2 - minX * xh, base = h * .66;
    const X = u => ox + u * xh, Y = y => base - y * xh;
    g.fillStyle = v('--surface'); g.fillRect(0, 0, w, h);
    [[2.2, v('--rule'), []], [1, v('--rule'), [7, 7]], [0, v('--rule'), []], [-1, v('--rule-soft'), []]].forEach(([y, col, d]) => { g.setLineDash(d); g.strokeStyle = col; g.lineWidth = 1.3; g.beginPath(); g.moveTo(0, Y(y)); g.lineTo(w, Y(y)); g.stroke(); });
    g.setLineDash([]); g.strokeStyle = v('--margin'); g.beginPath(); g.moveTo(26, 0); g.lineTo(26, h); g.stroke();
    const beat = reduce ? total : ((performance.now() - t0) / 1000) / spb;
    const path = (pts, upto = 1) => { const n = Math.max(1, Math.round(upto * (pts.length - 1))); g.beginPath(); for (let i = 0; i <= n; i++){ const p = pts[i]; i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])); } };
    g.lineCap = 'round'; g.lineJoin = 'round';
    plan.forEach(({ s }) => { g.strokeStyle = v('--line-2'); g.lineWidth = 3; g.setLineDash([3, 8]); path(s.pts); g.stroke(); });
    g.setLineDash([]);
    let hud = beat < 4 ? `Count-in <b>${4 - Math.floor(Math.max(0, beat))}</b> · ${BPM} BPM` : 'Finished · 1 stroke per beat';
    plan.forEach(({ s, b0 }, i) => {
      const f = Math.max(0, Math.min(1, beat - b0)); if (f <= 0) { if (beat > b0 - 1 && beat < b0 && i && s.lift) hud = `Lift your pen · dot the <b>${s.ch}</b>`; return; }
      g.strokeStyle = f < 1 ? v('--blue') : v('--ink'); g.lineWidth = f < 1 ? 5 : 3.6; path(s.pts, f); g.stroke();
      if (f < 1) { const p = s.pts[Math.round(f * (s.pts.length - 1))]; g.fillStyle = v('--blue'); g.globalAlpha = .22; g.beginPath(); g.arc(X(p[0]), Y(p[1]), 14, 0, 7); g.fill(); g.globalAlpha = 1; g.beginPath(); g.arc(X(p[0]), Y(p[1]), 6.5, 0, 7); g.fill();
        hud = `Beat <b>${Math.floor(beat) - 3}</b> · <b>${esc(s.ch)}</b> · ${esc(s.name)}`; }
    });
    const hudEl = $('#heroHud'); if (hudEl) hudEl.innerHTML = hud;
    const fb = beat - Math.floor(beat), on = !reduce && beat >= 0 && fb < .18, k = Math.floor(beat) % 4;
    $$('.metro-dots i').forEach((d, i) => { d.classList.toggle('on', on && i === k); d.classList.toggle('acc', on && i === 0); });
    if (beat >= total && !reduce) { t0 = performance.now(); heroTick(true); }
    if (!reduce) raf = requestAnimationFrame(draw);
  };
  draw();
  cleanup.push(() => { cancelAnimationFrame(raf); stopHeroSound(); });
  ACT['hero-sound'] = () => { if (heroAudio) { stopHeroSound(); return; } t0 = performance.now() + 120; startHeroSound(spb, total); };
}
function startHeroSound(spb, total){
  try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); heroAudio = { ctx, beat: 0, next: ctx.currentTime + .12, spb, total };
    const click = (t, acc) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = acc ? 1568 : 1046; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(acc ? .5 : .3, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .08); o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + .1);
      const k = ctx.createOscillator(), kg = ctx.createGain(); k.frequency.setValueAtTime(140, t); k.frequency.exponentialRampToValueAtTime(45, t + .12); kg.gain.setValueAtTime(acc ? .6 : .35, t); kg.gain.exponentialRampToValueAtTime(.001, t + .25); k.connect(kg).connect(ctx.destination); k.start(t); k.stop(t + .3); };
    heroAudio.timer = setInterval(() => { const A = heroAudio; if (!A) return; while (A.next < ctx.currentTime + .15) { click(A.next, A.beat % 4 === 0); A.beat = (A.beat + 1) % A.total; A.next += A.spb; } }, 30);
    const b = $('#heroSound'); if (b) b.innerHTML = `${IC.pause} Stop the beat`;
  } catch (e) { toast('This browser can’t play sound here.'); }
}
function heroTick(){ if (heroAudio) { heroAudio.beat = 0; } }
function stopHeroSound(){ if (!heroAudio) return; clearInterval(heroAudio.timer); try { heroAudio.ctx.close(); } catch (e) {} heroAudio = null; const b = $('#heroSound'); if (b) b.innerHTML = `${IC.music} Hear the beat`; }

const myClasses = (all = false) => DB.classes.filter(c => c.teacherId === state.user.id && (all || !c.archived)).sort((a, b) => a.created - b.created);
function scope(cid = 'all'){
  const classes = myClasses().filter(c => cid === 'all' || c.id === cid), ids = new Set(classes.map(c => c.id));
  const kids = DB.users.filter(u => u.role === 'student' && ids.has(u.classId)), kidIds = new Set(kids.map(k => k.id));
  return { classes, kids, lessons: DB.lessons.filter(l => ids.has(l.classId)), attempts: DB.attempts.filter(a => kidIds.has(a.userId)) };
}
function period(d, from, to){
  const at = d.attempts.filter(a => a.date >= from && a.date < to), tests = at.filter(a => a.mode === 'test');
  return { at, tests, seconds: at.reduce((s, a) => s + (a.seconds || 0), 0), avgTest: tests.length ? tests.reduce((s, a) => s + a.score, 0) / tests.length : null,
    completed: tests.length, active: new Set(at.map(a => a.userId)).size, reversed: tests.reduce((s, a) => s + (a.reversed || 0), 0) };
}
const nameOf = id => (userById(id) || {}).name || 'Student';
const medal = i => `<span class="medal ${i ? 'm' + (i + 1) : ''}">${i + 1}</span>`;
function awards(d, from, to){
  const at = d.attempts.filter(a => a.date >= from && a.date < to), by = new Map();
  at.forEach(a => { const e = by.get(a.userId) || { best: null, secs: 0, prac: [] }; e.secs += a.seconds || 0; if (a.mode === 'test') e.best = Math.max(e.best ?? 0, a.score); if (a.mode === 'practice' && a.score != null) e.prac.push(a); by.set(a.userId, e); });
  const rows = [...by.entries()];
  const top = rows.filter(([, e]) => e.best != null).sort((a, b) => b[1].best - a[1].best).slice(0, 3).map(([id, e]) => [id, pct(e.best)]);
  const most = rows.sort((a, b) => b[1].secs - a[1].secs).filter(([, e]) => e.secs > 0).slice(0, 3).map(([id, e]) => [id, fmtMin(e.secs)]);
  const imp = rows.map(([id, e]) => { const byL = new Map(); e.prac.forEach(a => { const l = byL.get(a.lessonId) || []; l.push(a); byL.set(a.lessonId, l); });
    let g = -1; byL.forEach(l => { if (l.length > 1) { l.sort((a, b) => a.date - b.date); g = Math.max(g, l[l.length - 1].score - l[0].score); } }); return [id, g]; })
    .filter(([, g]) => g > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id, g]) => [id, '+' + Math.round(g * 100) + ' pts']);
  const card = (title, c, ic, col, list, empty) => `<div class="award" style="--c:var(${c})"><div class="t"><span class="ic">${ic}</span><h3>${title}</h3></div>
    ${list.length ? `<table><thead><tr><th>Name</th><th>${col}</th></tr></thead><tbody>${list.map(([id, v], i) => `<tr><td>${medal(i)}<a href="#/student?id=${id}" style="color:inherit;text-decoration:none">${esc(nameOf(id))}</a></td><td class="num">${v}</td></tr>`).join('')}</tbody></table>` : `<p class="note">${empty}</p>`}</div>`;
  return `<div class="awards">${card('Top test scores', '--gold', IC.star, 'Score', top, 'No tests taken in this period.')}${card('Most practice', '--coral', IC.clock, 'Time', most, 'No practice yet.')}${card('Most improved', '--sky', IC.trend, 'Practice gain', imp, 'Shows once students practice a lesson more than once.')}</div>`;
}
function needsHand(d){
  const now = Date.now(), list = [];
  d.kids.forEach(k => {
    const tests = d.attempts.filter(a => a.userId === k.id && a.mode === 'test' && a.date > now - 30 * DAY), why = [];
    const avg = tests.length ? tests.reduce((s, a) => s + a.score, 0) / tests.length : null;
    if (avg != null && avg < .7) why.push(`<span class="pill bad">Tests ${pct(avg)}</span>`);
    const rev = tests.reduce((s, a) => s + (a.reversed || 0), 0); if (rev >= 2) why.push(`<span class="pill warn">${rev} backwards strokes</span>`);
    const late = d.lessons.filter(l => l.due && l.due < now && (!l.studentIds || l.studentIds.includes(k.id)) && l.classId === k.classId && !progress(k.id, l.id).done).length;
    if (late) why.push(`<span class="pill warn">${late} past due</span>`);
    if (why.length) list.push({ k, why, w: why.length + (avg != null ? 1 - avg : 0) });
  });
  return list.sort((a, b) => b.w - a.w).slice(0, 6);
}

function edCheck(D, preview){
  if (!preview && !D.title.trim()) return 'Give the lesson a title.';

  if (!(D.mult > 0)) return 'The tempo multiplier has to be more than 0.';
  return '';

  <div class="card"><div class="card-head"><div><h2>Handwriting checks: first vs latest</h2><p class="note">Students who have taken at least two checks. Checks have no music, so this is the pilot’s main measure.</p></div></div>
    ${checkPairs.length ? `<div class="row" style="gap:28px;align-items:baseline"><div><div class="note">First check</div><div style="font-size:34px;font-weight:900">${pct(first)}</div></div><div style="font-size:26px;color:var(--faint)">→</div><div><div class="note">Latest check</div><div style="font-size:34px;font-weight:900">${pct(last)}</div></div><div>${delta(last, first, { unit: '%' })} <span class="note">relative · ${checkPairs.length} students</span></div></div>` : '<p class="note">No student has taken two checks yet. Give every class a check at the start of the pilot and the same one at the end.</p>'}</div>
  <div class="table-wrap"><table class="t" style="min-width:1080px"><thead><tr><th>School</th><th>Teacher</th><th>Class</th><th>Students</th><th>Active this week</th><th>Lessons</th><th>Completed</th><th>Test avg</th><th>Min/day</th><th>Check change</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r.c.school || '–')}</td><td>${esc(r.t.name || '–')}</td><td><b>${esc(r.c.name)}</b></td><td class="num">${r.n}</td><td class="num">${r.active}</td><td class="num">${r.lessons}</td><td><div class="minibar"><span class="bar"><i style="width:${(r.comp || 0) * 100}%"></i></span><span class="num note">${pct(r.comp)}</span></div></td><td>${scorePill(r.avg)}</td><td class="num">${Math.round(r.mins * 10) / 10}</td><td class="num">${r.change == null ? '–' : `${r.change >= 0 ? '+' : ''}${Math.round(r.change * 100)} pts <span class="note">(${r.cpN})</span>`}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">No classes yet.</td></tr>'}</tbody></table></div>
  <div class="card"><div class="card-head"><h2>Teacher feedback</h2>${fb.length ? `<button class="btn sm" type="button" data-act="admin-feedback">${IC.download} Export</button>` : ''}</div>
    ${fb.length ? `<div class="stack" style="gap:12px">${fb.map(x => `<div style="border-bottom:1px solid var(--line);padding-bottom:10px"><div class="row" style="justify-content:space-between"><b>${esc((userById(x.userId) || {}).name || 'A teacher')}</b><span class="row" style="gap:8px">${x.rating ? `<span class="pill ${x.rating >= 4 ? 'ok' : x.rating <= 2 ? 'bad' : 'blue'}">${x.rating}/5</span>` : ''}<span class="note">${fmtDate(x.date)}</span></span></div>${x.body ? `<p style="margin-top:4px">${esc(x.body)}</p>` : ''}</div>`).join('')}</div>` : '<p class="note">No feedback yet. Teachers send it from the Feedback button at the top of every page.</p>'}</div>`;
});
Object.assign(ACT, {
  'admin-export': () => exportCSV('flowriter-pilot-results.csv', resultRows(DB.users.filter(u => u.role === 'student' && u.classId))),
  'admin-feedback': () => exportCSV('flowriter-feedback.csv', [['Date', 'Teacher', 'Rating', 'Feedback', 'Page'], ...(DB.feedback || []).map(x => [new Date(x.date).toISOString().slice(0, 10), (userById(x.userId) || {}).name || '', x.rating || '', x.body || '', x.page || ''])]),
});

// =====================================================================
// Student pages, and the lesson page shared by students, teacher previews
// and the no-account tryout.
// =====================================================================
route('home', { auth: 'student', nav: 'home', title: 'My lessons' }, () => {
  const u = state.user, c = classById(u.classId), t = c && userById(c.teacherId);
  if (!c) return `<form class="card stack" data-form="student-join" novalidate style="max-width:520px"><h1 style="font-size:24px">You’re not in a class right now</h1><p class="muted">Type the 6-letter code from your teacher to join their class. You keep your username and password.</p>
    <div class="field"><label for="sjCode">Class code</label><input class="input mono" id="sjCode" name="code" maxlength="6" autocomplete="off" style="font-size:22px;letter-spacing:.2em;text-transform:uppercase"></div><p class="form-error" role="alert"></p><button class="btn primary lg" type="submit" style="align-self:flex-start">Join the class</button></form>`;
  const items = lessonsForStudent(u).map(l => ({ l, p: progress(u.id, l.id) }));
  items.forEach(x => { x.lock = lessonLocked(u, x.l); });
  const todo = items.filter(x => !x.p.done).sort((a, b) => (!!a.lock - !!b.lock) || (b.p.started - a.p.started) || ((a.l.due || 9e15) - (b.l.due || 9e15))), done = items.filter(x => x.p.done).reverse();
  const next = todo.find(x => !x.lock), cal = activityCalendar(DB.attempts.filter(a => a.userId === u.id));
  const wk = studentStats(u.id, Date.now() - 7 * DAY);
  const stepTxt = p => p.check ? 'Handwriting check · no music, one try' : p.step === 0 ? 'Start with the demo' : p.step === 1 ? 'Next: practice with the music' : 'Next: take the test';
  const row = ({ l, p, lock }) => lock
    ? `<div class="lrow" style="opacity:.6;box-shadow:none"><span class="thumb" style="${l.theme ? `background-image:url(${themeImg(l.theme)})` : ''}"></span><span><b>${esc(l.title)}</b><small>Opens after you finish “${esc(lock.title)}”</small></span><span></span><span class="pill">${IC.lock} Locked</span></div>`
    : `<a class="lrow" href="#/lesson?id=${l.id}"><span class="thumb" style="${l.theme ? `background-image:url(${themeImg(l.theme)})` : ''}"></span><span><b>${esc(l.title)}</b><small>${p.done ? `Done · ${p.check ? 'check' : 'test'} ${pct(p.test.score)}` : esc(stepTxt(p))}${l.due && !p.done ? ' · ' + relDue(l.due) : ''}</small></span>${p.check ? '<span class="pill warn">Check</span>' : stepsMini(p)}${p.done ? scorePill(p.test.score) : `<span class="btn sm primary">${p.started ? 'Continue' : 'Start'}</span>`}</a>`;
  return `<div class="page-title"><div><p class="eyebrow">${esc(c.name)}</p><h1>Hi, ${esc(firstName(u))}!</h1></div>${cal.weeks ? `<span class="streak">${IC.bolt.replace('<svg', '<svg style="width:14px;height:14px"')}${cal.weeks} week streak</span>` : ''}</div>
  <div class="two-col">
    <div class="stack">
      ${next ? `<div class="card up-next"><div class="side"><p class="eyebrow">Up next</p><h2 style="font-size:24px">${esc(next.l.title)}</h2>
          <div class="tracker" style="grid-template-columns:1fr;gap:8px">${trackerSteps(next.p, next.l, true)}</div>
          <a class="btn primary lg" href="#/lesson?id=${next.l.id}">${IC.play} ${next.p.started ? 'Keep going' : 'Start the lesson'}</a></div>
        <div class="pv" style="${next.l.theme ? `background-image:url(${themeImg(next.l.theme)})` : ''}"><canvas id="nextCv" data-text="${esc(next.l.text)}"></canvas></div></div>`
        : `<div class="banner ok"><span class="big">${IC.check}</span><div><b>You’re all caught up.</b><div class="note">New lessons from ${esc(t ? t.name : 'your teacher')} show up here.</div></div></div>`}
      ${todo.filter(x => x !== next).length ? `<div class="sec-head"><h2><span class="ico">${IC.book}</span>To do</h2></div><div class="lesson-list">${todo.filter(x => x !== next).map(row).join('')}</div>` : ''}
      ${done.length ? `<div class="sec-head"><h2><span class="ico">${IC.check}</span>Finished</h2></div><div class="lesson-list">${done.map(row).join('')}</div>` : ''}
    </div>
    <div class="stack">
      ${c.message ? `<div class="msg-card"><small>Message from ${esc(t ? t.name : 'your teacher')}</small><p class="q">${esc(c.message)}</p></div>` : ''}
      <div class="card"><div class="card-head"><h2>My writing · ${esc(cal.title)}</h2></div>${cal.html}
        <div class="legend" style="margin-top:12px"><span><i style="background:var(--gold)"></i>10 mins or more</span><span><i style="background:color-mix(in srgb,var(--gold) 30%,var(--surface))"></i>Some writing</span></div>
        <p style="margin-top:12px;font-weight:800">${fmtMin(wk.seconds)} this week</p></div>
    </div>
  </div>`;
}, () => { const c = $('#nextCv'); if (c) paintPreview(c, c.dataset.text, { xh: 22, maxLines: 2 }); });

route('progress', { auth: 'student', nav: 'progress', title: 'My progress' }, () => {
  const u = state.user, all = DB.attempts.filter(a => a.userId === u.id), st = studentStats(u.id), cal = activityCalendar(all), items = lessonsForStudent(u).map(l => ({ l, p: progress(u.id, l.id) }));
  const done = items.filter(x => x.p.done);
  return `<div class="page-title"><h1>My progress</h1></div>
  <div class="kpis">${kpi('Lessons finished', `${done.length}<small>/ ${items.length}</small>`)}${kpi('Test average', pct(st.avgTest))}${kpi('Practice runs', st.practice)}${kpi('Writing time', fmtMin(st.seconds))}</div>
  <div class="two-col"><div class="card"><div class="card-head"><h2>${esc(cal.title)}</h2>${cal.weeks ? `<span class="streak">${cal.weeks} week streak</span>` : ''}</div>${cal.html}</div>
    <div class="card"><div class="card-head"><h2>Letters I’m working on</h2></div>${letterGrid(letterReport(all), 9)}</div></div>
  <div class="card stack" style="max-width:560px"><h2 style="font-size:17px">My settings</h2>
    <label class="check"><input type="checkbox" data-change="handed" ${u.handed === 'left' ? 'checked' : ''}><span>I write with my left hand. The hints move to the other side of the pen so your hand doesn’t cover them.</span></label></div>`;
}, () => paintGlyphs());

// ---------------------------------------------------------------- lesson page
route('lesson', { auth: 'student', nav: 'home', title: q => (lessonById(q.get('id')) || {}).title || 'Lesson' }, q => {
  const l = lessonById(q.get('id')); if (!l || !lessonsForStudent(state.user).includes(l)) { go('home'); return null; }
  const lock = lessonLocked(state.user, l); if (lock) { go('home'); setTimeout(() => toast(`Finish “${esc(lock.title)}” first.`), 50); return null; }
  return lessonPage(l, { back: 'home' });
}, () => lessonAfter({}));

// live: the steps are the lesson's controls (buttons that drive the engine); open: every step is unlocked (tryout, preview)
function trackerSteps(p, l, compact, live, open){
  const s = (n, cls, title, sub, mode) => { const inner = `<span class="n">${cls === 'done' ? IC.check : cls === 'lock' ? IC.lock : n}</span><span><b>${title}</b><small>${sub}</small></span>`;
    return live ? `<button type="button" class="tstep ${cls}" data-act="mode" data-mode="${mode}">${inner}</button>` : `<div class="tstep ${cls}">${inner}</div>`; };
  if (isCheck(l)) return s(1, p.test ? 'done' : 'now', 'Handwriting check', p.test ? `Score ${pct(p.test.score)}` : 'No music, no demo, one try. Write as neatly as you can.', 'test');
  const now = !p.demo ? 1 : !p.practice ? 2 : !p.test ? 3 : 0, lock = open ? '' : 'lock';
  return s(1, p.demo ? 'done' : now === 1 ? 'now' : '', 'Watch the demo', p.demo ? `Watched ${p.demo}×` : 'Start here, as often as you like', 'demo')
    + s(2, p.practice ? 'done' : now === 2 ? 'now' : lock, 'Practice with the music', p.practice ? `${p.practice} run${p.practice > 1 ? 's' : ''} · best ${pct(p.bestPractice)}` : p.demo || open ? 'The music waits for you' : 'Opens after the demo', 'practice')
    + s(3, p.test ? 'done' : now === 3 ? 'now' : lock, 'Take the test', p.test ? `Score ${pct(p.test.score)}` : p.practice || open ? 'No music · one try' : 'Opens after practice', 'test');
}
// mirror what the engine says each step can do right now (locked, running, "tap again" before the test)
function paintModes(){
  const M = state.launch && state.launch.modes; if (!M) return;
  $$('#tracker [data-mode]').forEach(b => { const m = M[b.dataset.mode]; if (!m) return; b.disabled = m.off; b.classList.toggle('running', m.run);
    if (b.dataset.mode === 'test' && M.confirm) { b.querySelector('b').textContent = 'Start the test?'; b.querySelector('small').textContent = 'You only get one try. Tap again to start.'; } });
}
// clicked synchronously so the tap still counts as the user gesture that lets the engine start audio (iPad)
ACT.mode = t => { const id = { demo: 'demoBtn', practice: 'pracBtn', test: 'testBtn' }[t.dataset.mode], b = $('#engineWrap iframe')?.contentDocument?.getElementById(id); if (b && !b.disabled) b.click(); };
function lessonPage(l, { guest, preview, back } = {}){
  const s = songById(l.songId), bpm = Math.round((s ? s.bpm : 84) * l.mult * 10) / 10, c = classById(l.classId);
  state.launch = { ...(state.launch || {}), lesson: l, guest, preview, back, modes: null, local: { demo: 0, practice: 0, test: null, bestPractice: 0 } };
  const theme = THEMES.find(t => t.id === l.theme) || THEMES[0];
  return `<a class="crumbs" href="#/${back || (guest ? '' : 'home')}" style="text-decoration:none">${IC.back.replace('<svg', '<svg style="width:16px;height:16px"')} ${guest ? 'Back to FloWriter' : preview ? 'Back' : 'My lessons'}</a>
  <div class="lesson-head"><div><p class="eyebrow">${guest ? 'Try a lesson' : preview ? 'Student preview' : esc(c ? c.name : 'Lesson')}</p><h1>${esc(l.title)}</h1></div>
    <div class="row">${isCheck(l) ? '<span class="pill warn">Handwriting check · no music</span>' : `<span class="pill">${IC.music}${esc(s ? s.title : 'Built-in beat')} · ${bpm} BPM</span>`}<span class="pill">${esc(theme.label)}</span><span class="pill">${DIFF[l.difficulty || 'standard'].label}</span>${l.due && !guest ? `<span class="pill ${l.due < Date.now() + 2 * DAY ? 'warn' : ''}">${relDue(l.due)}</span>` : ''}</div></div>
  ${guest ? `<div class="banner blue">${IC.eye}<div><b>Nothing is saved in a tryout.</b> <span class="note">Teachers can <a href="#/signup">start a class</a>; students can <a href="#/join">join with a code</a>.</span></div></div>`
    : preview ? `<div class="banner blue">${IC.eye}<div><b>Preview.</b> <span class="note">This is what students see. Nothing is saved, and every step is open.</span></div></div>` : ''}
  <div class="tracker" id="tracker"></div>
  <div id="doneBox"></div>
  <div class="engine-wrap" id="engineWrap"></div>`;
}
function lessonProgress(){
  const L = state.launch, u = state.user;
  if (L.guest || L.preview) return L.local;
  return progress(u.id, L.lesson.id);
}
function paintTracker(){
  const L = state.launch, p = lessonProgress(), el = $('#tracker'); if (!el) return;
  el.innerHTML = trackerSteps(p, L.lesson, false, true, L.guest || L.preview); paintModes();
  const box = $('#doneBox');
  if (box) box.innerHTML = p.test ? `<div class="banner ok"><span class="big">${pct(p.test.score)}</span><div style="flex:1;min-width:200px"><b>${L.guest || L.preview ? 'Test scored.' : 'Lesson complete!'}</b> <span class="note">${p.test.valid} of ${p.test.total} strokes on the line${p.test.reversed ? ` · ${p.test.reversed} drawn backwards` : ''}. ${L.guest || L.preview ? '' : 'You can keep watching and practicing.'}</span></div>
    ${p.test.letters && p.test.letters.some(x => x.score < .9) ? `<div class="row" style="gap:6px"><span class="note" style="font-weight:800">Practice these:</span>${p.test.letters.filter(x => x.score < .9).sort((a, b) => a.score - b.score).slice(0, 3).map(x => `<span class="pill ${x.score < .7 ? 'bad' : 'blue'}" style="font-size:15px">${esc(x.ch)} ${pct(x.score)}</span>`).join('')}</div>` : ''}</div>` : '';
}
function lessonAfter(){
  const L = state.launch; if (!L || !L.lesson) return;
  paintTracker();
  const l = L.lesson, song = isCheck(l) ? null : songById(l.songId), p = lessonProgress();
  const role = L.guest || L.preview ? 'preview' : 'student';
  let active = 0, lastAt = Date.now(), lastRec = null;
  mountEngine($('#engineWrap'), { word: cleanText(l.text), title: l.title, bps: l.bps || 1, rest: l.rest ?? 1, tol: DIFF[l.difficulty || 'standard'].tol, skin: l.theme || '', role, checkOnly: isCheck(l),
    progress: role === 'preview' ? { demo: 1, practice: 1 } : { demo: p.demo, practice: p.practice, test: p.test ? { score: p.test.score, valid: p.test.valid, total: p.test.total } : null } }, song, l.mult || 1, m => {
    if (m.type === 'active') { active += 5; return; }
    if (m.type === 'modes') { L.modes = m; paintModes(); return; }
    if (m.type !== 'run') return;
    const wall = (Date.now() - lastAt) / 1000; lastAt = Date.now();
    const seconds = Math.round(m.mode === 'demo' ? Math.min(150, wall) : Math.max(5, Math.min(wall, active + 5))); active = 0;
    if (role === 'preview') {
      const loc = L.local; if (m.mode === 'demo') loc.demo++; else if (m.mode === 'practice') { loc.practice++; loc.bestPractice = Math.max(loc.bestPractice, m.score || 0); } else loc.test = { score: m.score, valid: m.valid, total: m.total, reversed: m.reversed, letters: m.letters };
    } else {
      lastRec = api.recordAttempt({ userId: state.user.id, lessonId: l.id, mode: m.mode, score: m.score, valid: m.valid, total: m.total, reversed: m.reversed || 0, gate: m.gate || null, bpm: m.bpm ?? null, seconds,
        letters: m.mode === 'test' ? m.letters : null, trace: m.mode === 'demo' ? null : m.img });
    }
    paintTracker();
    if (m.mode === 'practice') toast(`Practice: <b>${pct(m.score)}</b> · ${m.valid} of ${m.total} strokes on the line${m.reversed ? ` · ${m.reversed} backwards` : ''}`);
    if (m.mode === 'test') { toast(`Test submitted: <b>${pct(m.score)}</b>`, 4500); $('#doneBox')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  });
  cleanup.push(() => { if (lastRec && lastRec.mode !== 'test' && active > 0) api.addSeconds(lastRec.id, active); });
}

CHANGE.handed = t => { api.updateProfile({ handed: t.checked ? 'left' : 'right' }); toast(t.checked ? 'Hints now sit on the right of the pen' : 'Hints now sit on the left of the pen'); };
FORMS['student-join'] = async f => { const c = await api.changeClass(f.code.value); state.user = userById(state.user.id) || state.user; rerender(); toast(`You joined ${esc(c.name)}`); };

// =====================================================================
// Boot: form submits, then start (with Supabase when config.js is present)
// =====================================================================
document.addEventListener('submit', async e => {
  const f = e.target, name = f.dataset.form; if (!name) return; e.preventDefault();
  if (FORMS[name]) { const err = f.querySelector('.form-error'); if (err) err.textContent = ''; try { await FORMS[name](f); } catch (x) { if (err) err.textContent = x.message; else toast(esc(x.message)); } return; }
  submitForm(name, f);
});
if (typeof Backend !== 'undefined' && Backend.enabled) {
  $('#app').innerHTML = '<div class="auth"><p class="muted" style="font-weight:800">Loading FloWriter…</p></div>';
  Backend.boot().catch(e => { console.error('[flowriter] boot', e); setTimeout(() => toast('Couldn’t reach the FloWriter server. Check config.js and your connection.', 8000), 300); }).then(() => { if (state.recovery) { history.replaceState(null, '', location.href.split('#')[0] + '#/reset'); } render(); });
} else { restoreSession(); render(); }

</script>
</body>
</html>
