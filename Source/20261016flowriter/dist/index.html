<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="FloWriter: cursive handwriting practice written to the beat.">
<title>FloWriter Pilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark teal navigation rail beside a white workspace (app); public pages are full-width bands
   with a centered 1120px column. Cursive itself is the display face: it is drawn by the app, not set in a font.
   Palette: dark teal (structure, buttons), Coca-Cola red (accents), white and black. --blue* names are kept
   from the first design and now hold the teal. --red is for large text and graphics; small red text uses --red-ink. */
:root{
  --rail:#0a3f45; --rail-2:#0b5961; --rail-ink:#ffffff; --rail-soft:rgba(255,255,255,.76); --rail-hi:rgba(255,255,255,.13); --rail-mark:#ff3b40;
  --bg:#f5f8f8; --surface:#ffffff; --surface-2:#f1f5f5; --ink:#0b0f10; --muted:#4a5a5c; --faint:#7a8b8d; --line:#e1e8e8; --line-2:#c7d3d4;
  --blue:#0e6e76; --blue-ink:#0b5961; --blue-wash:#e2f0f1; --btn:#0b5961; --btn-ink:#ffffff;
  --red:#f40009; --red-ink:#d4000b;
  --ok:#157a45; --ok-wash:#e2f5ea; --bad:#b8322b; --bad-wash:#fdebea; --warn:#946200; --warn-wash:#fdf3dc;
  --gold:#f0b429; --coral:#f40009; --sky:#53a3f0; --lilac:#8b7cf6;
  --rule:#b9d3d6; --rule-soft:#dde9ea; --margin:#f0a3a3;
  --shadow:0 1px 2px rgba(6,40,44,.06),0 6px 18px rgba(6,40,44,.07);
  --ui:'Nunito',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --rail:#072a2e; --rail-2:#0b3a3f; --rail-ink:#f2f6f6; --rail-soft:rgba(242,246,246,.72); --rail-hi:rgba(255,255,255,.08); --rail-mark:#ff3b40;
  --bg:#060909; --surface:#0e1718; --surface-2:#132123; --ink:#f2f6f6; --muted:#a2b4b5; --faint:#75898a; --line:#1d2e30; --line-2:#2a4144;
  --blue:#3db7c0; --blue-ink:#7fd5db; --blue-wash:#0f2b2e; --btn:#0c6870; --btn-ink:#ffffff;
  --red:#ff3b40; --red-ink:#ff3b40;
  --ok:#4cc386; --ok-wash:#173627; --bad:#f07a72; --bad-wash:#3a1d1c; --warn:#f0b84a; --warn-wash:#3a2e14;
  --gold:#f2c14e; --coral:#ff3b40; --sky:#6db2f3; --lilac:#a196f8;
  --rule:#24464a; --rule-soft:#173235; --margin:#a35a5a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --rail:#072a2e; --rail-2:#0b3a3f; --rail-ink:#f2f6f6; --rail-soft:rgba(242,246,246,.72); --rail-hi:rgba(255,255,255,.08); --rail-mark:#ff3b40;
  --bg:#060909; --surface:#0e1718; --surface-2:#132123; --ink:#f2f6f6; --muted:#a2b4b5; --faint:#75898a; --line:#1d2e30; --line-2:#2a4144;
  --blue:#3db7c0; --blue-ink:#7fd5db; --blue-wash:#0f2b2e; --btn:#0c6870; --btn-ink:#ffffff;
  --red:#ff3b40; --red-ink:#ff3b40;
  --ok:#4cc386; --ok-wash:#173627; --bad:#f07a72; --bad-wash:#3a1d1c; --warn:#f0b84a; --warn-wash:#3a2e14;
  --gold:#f2c14e; --coral:#ff3b40; --sky:#6db2f3; --lilac:#a196f8;
  --rule:#24464a; --rule-soft:#173235; --margin:#a35a5a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--blue-ink)}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .note{color:var(--muted);font-size:13.5px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--red-ink)}
.spacer{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
svg{flex:none}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 15px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{border-color:var(--blue);color:var(--blue-ink)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px} .btn.sm svg{width:15px;height:15px}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--blue-ink);border-color:var(--blue)} .icon-btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:800;font-size:13.5px}
.field small{color:var(--muted);font-size:12.5px}
.input{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600}
.input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-wash)}
textarea.input{min-height:92px;resize:vertical;line-height:1.5}
select.input{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.check{display:flex;align-items:flex-start;gap:9px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--blue);flex:none}
.seg{display:inline-flex;border:1.5px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.form-error{color:var(--bad);font-weight:700;font-size:14px;min-height:1px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--blue);color:var(--blue-ink)}
.chip[aria-pressed="true"]{background:var(--blue-wash);border-color:var(--blue);color:var(--blue-ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.ok{background:var(--ok-wash);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-wash);color:var(--warn);border-color:transparent}
.pill.blue{background:var(--blue-wash);color:var(--blue-ink);border-color:transparent}
.delta{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11.5px;font-weight:500;border-radius:6px;padding:1px 6px}
.delta.up{background:var(--ok-wash);color:var(--ok)} .delta.down{background:var(--bad-wash);color:var(--bad)} .delta.flat{background:var(--surface-2);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.blue>i{background:var(--blue)}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .bar{flex:1}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--blue-wash);color:var(--blue-ink);font-weight:900;font-size:14px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-weight:600}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.card-head h2{font-size:17px}
.sec-head{display:flex;align-items:flex-end;gap:12px;justify-content:space-between;flex-wrap:wrap}
.sec-head h2{font-size:21px;display:flex;align-items:center;gap:10px}
.sec-head h2 .ico{color:var(--blue)} .sec-head h2 svg{width:24px;height:24px}
.sec-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.kpi .in{padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.kpi .k{font-size:13.5px;font-weight:800;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:800;margin-left:2px}
.kpi .p{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--muted);font-weight:700}
.kpi .p b{color:var(--ink)}
.kpi .cmp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;font-weight:700;border-top:1px solid var(--line)}
.kpi .cmp.good{background:var(--ok-wash)} .kpi .cmp.weak{background:var(--bad-wash)}
.awards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:960px){.awards{grid-template-columns:1fr}}
.award{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.award .t{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.award .t .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.award .t .ic svg{width:22px;height:22px}
.award h3{font-size:18px}
.award table{width:100%;border-collapse:collapse;font-size:14px}
.award th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:0 0 6px}
.award th:last-child,.award td:last-child{text-align:right}
.award td{padding:7px 0;border-top:1px solid var(--line);font-weight:700}
.medal{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:900;margin-right:8px;color:#5a4300;background:#f4cf5e}
.medal.m2{background:#d5dbe3;color:#3f4955} .medal.m3{background:#e8b48a;color:#5a3110}

/* ---------- tables ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.t th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
table.t .name-cell{display:flex;align-items:center;gap:10px}
table.t .name-cell b{display:block} table.t .name-cell small{color:var(--muted);font-size:12.5px}
table.t .acts{display:flex;gap:6px;justify-content:flex-end}
.steps-mini{display:inline-flex;gap:4px}
.steps-mini i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-style:normal;font-size:11px;font-weight:900;background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
.steps-mini i.on{background:var(--ok-wash);color:var(--ok);border-color:transparent}
.steps-mini i.now{background:var(--blue-wash);color:var(--blue-ink);border-color:transparent}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--rail-2) 236px,transparent 236px)}
.rail{background:linear-gradient(180deg,var(--rail),var(--rail-2));color:var(--rail-ink);padding:18px 0 24px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding-left:env(safe-area-inset-left,0px)}
.rail .brand{padding:4px 22px 18px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.rail nav{display:flex;flex-direction:column}
.rail a.nav{display:flex;align-items:center;gap:12px;padding:12px 22px;color:var(--rail-soft);text-decoration:none;font-weight:800;font-size:15px;border-left:4px solid transparent}
.rail a.nav svg{width:20px;height:20px}
.rail a.nav:hover{color:var(--rail-ink);background:var(--rail-hi)}
.rail a.nav[aria-current="page"]{color:var(--rail-ink);background:var(--rail-hi);border-left-color:var(--rail-mark)}
.rail .foot{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:var(--rail-soft)}
.rail .foot b{color:var(--rail-ink)}
.top{display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.search{position:relative;flex:0 1 320px;min-width:0}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search .results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;overflow:hidden}
.search .results a{display:flex;gap:10px;align-items:center;padding:9px 12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px}
.search .results a:hover,.search .results a:focus{background:var(--surface-2)}
.search .results small{color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:10px}
.who .nm{font-weight:800;font-size:14px;line-height:1.1} .who .rl{font-size:12px;color:var(--muted);font-weight:700}
.main{padding:24px max(28px,env(safe-area-inset-right,0px)) 48px 28px;display:flex;flex-direction:column;gap:24px;min-width:0;max-width:1240px}
.demo-band{background:var(--warn-wash);color:var(--ink);font-size:13px;font-weight:700;padding:7px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.demo-band button{border:0;background:none;color:var(--blue-ink);font-weight:800;cursor:pointer;padding:0;text-decoration:underline}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.crumbs a{color:var(--blue-ink)} .crumbs span{color:var(--faint)}
.page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.page-title h1{font-size:28px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:800;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.two-col{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1050px){.two-col{grid-template-columns:1fr}}
.two-col>*,.grid>*{min-width:0}
.cal-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
@media (max-width:700px){.cal-split{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .rail nav{min-width:0;flex:1}
  .rail .wordmark{height:26px}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));z-index:6;gap:8px}
  .rail .brand{padding:0 6px 0 0;border:0;margin:0}
  .rail nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .rail a.nav{padding:8px 11px;border-left:0;border-bottom:3px solid transparent;font-size:13.5px;gap:7px;white-space:nowrap}
  .rail a.nav[aria-current="page"]{border-bottom-color:var(--rail-mark)}
  .rail .foot{display:none}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));top:56px}
  .main{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .demo-band{padding-inline:16px}
  .who .nm,.who .rl{display:none}
}

/* ---------- wordmark ---------- */
.wordmark{display:block;height:34px;width:auto}
.wordmark path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* ---------- public site ---------- */
.site-nav{display:flex;align-items:center;gap:18px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto;width:100%}
.site-nav .links{display:flex;gap:18px;font-weight:800;font-size:14.5px}
.site-nav .links a{color:var(--muted);text-decoration:none} .site-nav .links a:hover{color:var(--blue-ink)}
.site-head{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
@media (max-width:820px){.site-nav .links{display:none}}
@media (max-width:480px){.site-nav{gap:8px}.site-nav .btn.ghost{display:none}.site-nav .wordmark{height:28px}}
.band{padding-block:72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.band.blue{background:linear-gradient(160deg,var(--rail),var(--rail-2));color:#fff}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.band h2.big{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em}
.lead{font-size:18px;color:var(--muted);max-width:60ch;line-height:1.55}
.hero{padding-block:56px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '<\/tr>';
      }

      qrHtml += '<\/tbody>';
      qrHtml += '<\/table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '<\/title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '<\/description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '<\/svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }

ba(190,190,255,.12); --frame:#3A3550; --frame-lit:#55506E; --tray:#2A2640;\n}\n/* FW-THEMES:END */\nbody.pilot .modes,body.pilot .topbar,body.pilot #view-setup,body.pilot #checkBtn,body.pilot .skin-pick,body.pilot .how,body.pilot #testAdmin{display:none!important}\nbody.pilot .modes{grid-template-columns:repeat(3,minmax(0,1fr))}\nbody.check-only #demoBtn,body.check-only #pracBtn,body.check-only #beatmap,body.check-only #waveWWrap{display:none!important}\nbody.check-only .modes{grid-template-columns:1fr}\n.sound-ctl{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}\n.sound-ctl button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}\n.sound-ctl button[aria-pressed=\"false\"]{color:var(--muted);text-decoration:line-through}\n.sound-ctl input[type=range]{width:110px;accent-color:var(--accent)}\nbody:not(.pilot) .sound-ctl{display:none}\n@media (max-width:720px){body.pilot .modes{grid-template-columns:1fr}}\nbody.pilot #view-write>.view-head .eyebrow,body.pilot #lessonTitle{display:none}\nbody.pilot .wrap{padding-block:8px 24px;padding-inline:0}\n.mode:disabled:not(.running){opacity:.55;cursor:not-allowed}\n.cell.rest.lift .ch{color:var(--accent-ink)}\n\n\n\n\n<\/style>\n\n<script>try{var t=localStorage.getItem(\"flowriter-theme\");if(t===\"light\"||t===\"dark\")document.documentElement.dataset.theme=t}catch(e){}<\/script>\n<\/head>\n<body>\n<main class=\"wrap\">\n  <div class=\"topbar\">\n  <nav class=\"steps\" aria-label=\"Assignment steps\">\n    <button type=\"button\" class=\"step teacher-only\" data-go=\"setup\" aria-current=\"page\"><span class=\"sn\">1<\/span>Setup<\/button>\n    <button type=\"button\" class=\"step\" data-go=\"write\" aria-current=\"false\"><span class=\"sn\">2<\/span>Lesson<\/button>\n    <button type=\"button\" class=\"step\" data-go=\"results\" id=\"resultsStep\" aria-current=\"false\"><span class=\"sn\">3<\/span>Results<\/button>\n  <\/nav>\n    <div class=\"top-actions\">\n      <button type=\"button\" class=\"btn lock-btn\" id=\"lockBtn\"><\/button>\n      <button type=\"button\" class=\"theme-btn\" id=\"themeBtn\" aria-label=\"Switch theme\"><\/button>\n    <\/div>\n  <\/div>\n\n  <\!-- ================= 1. SETUP ================= -->\n  <section class=\"view\" id=\"view-setup\">\n    <div class=\"view-head\">\n      <div><h1>Assignment setup<\/h1><p class=\"note\">Name the lesson, then add the words and the music. Lock it to see exactly what students see.<\/p><\/div>\n      <div class=\"foot-actions\">\n        <span class=\"note\" id=\"setupSummary\"><\/span>\n        <button class=\"btn primary\" type=\"button\" data-go=\"write\">Continue to writing<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"composer\">\n      <div class=\"composer-head\"><label for=\"lessonName\">Lesson name<\/label><span>Shown to students as the page title<\/span><\/div>\n      <input id=\"lessonName\" class=\"name-input\" type=\"text\" maxlength=\"80\" placeholder=\"e.g. Lesson 3 · Ovals: a, d, g, o\" autocomplete=\"off\">\n    <\/div>\n\n    <div class=\"composer\" id=\"composer\">\n      <div class=\"composer-head\">\n        <label for=\"customWord\">What to write<\/label>\n        <span>Press Enter to write it out<\/span>\n      <\/div>\n      <div class=\"composer-box\">\n        <svg class=\"pen\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M13.5 3.5l3 3L7 16H4v-3z M11.5 5.5l3 3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\/svg>\n        <textarea id=\"customWord\" rows=\"1\" maxlength=\"300\" placeholder=\"Type a word, a sentence, or a whole paragraph…\" autocomplete=\"off\" spellcheck=\"false\"><\/textarea>\n        <button type=\"button\" class=\"composer-clear\" id=\"customClear\" aria-label=\"Clear text\" hidden><svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M2 2l8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><\/svg><\/button>\n      <\/div>\n      <div class=\"composer-foot\">\n        <span class=\"allowed\">Letters A to Z and <kbd>.<\/kbd><kbd>,<\/kbd><kbd>!<\/kbd><kbd>?<\/kbd><kbd>'<\/kbd><\/span>\n        <span class=\"meta\"><span id=\"charCount\">0 / 300<\/span> · <span id=\"pageInfo\">1 page<\/span><\/span>\n      <\/div>\n    <\/div>\n\n    <section class=\"panel\" aria-label=\"Settings\">\n      <h2>Pacing and scoring<\/h2>\n      <div class=\"settings-grid\">\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label for=\"bpm\">Tempo<\/label><span class=\"val\" id=\"bpmVal\">84 BPM<\/span><\/div>\n          <input id=\"bpm\" type=\"range\" min=\"20\" max=\"320\" step=\"1\" value=\"84\">\n          <small>Slower tempos give younger writers more time per stroke.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label for=\"tol\">Margin of error<\/label><span class=\"val\" id=\"tolVal\">18% of x-height<\/span><\/div>\n          <input id=\"tol\" type=\"range\" min=\"6\" max=\"40\" step=\"1\" value=\"18\">\n          <small>How far the child's line can stray from the model and still count. Drag it after an attempt to see strokes re-score.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"gateLbl\">Practice help<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"gateLbl\">\n            <button type=\"button\" data-gate=\"hold\" aria-pressed=\"true\">Waits<\/button>\n            <button type=\"button\" data-gate=\"duck\" aria-pressed=\"false\">Quiets<\/button>\n            <button type=\"button\" data-gate=\"off\" aria-pressed=\"false\">None<\/button>\n          <\/div>\n          <label class=\"inline\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"gateFade\" checked> Fade the help as the word is practised<\/label>\n          <small>Waits: the music stops until the pen is back. Quiets: it keeps playing but thins out. Fading moves from waits to quiets to none, so the writing does not lean on the music.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"bpsLbl\">Beats per stroke<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"bpsLbl\">\n            <button type=\"button\" data-bps=\"1\" aria-pressed=\"true\">1 beat<\/button>\n            <button type=\"button\" data-bps=\"2\" aria-pressed=\"false\">2 beats<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"restLbl\">Rest for each space<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"restLbl\">\n            <button type=\"button\" data-rest=\"0\" aria-pressed=\"false\">None<\/button>\n            <button type=\"button\" data-rest=\"1\" aria-pressed=\"true\">1 beat<\/button>\n            <button type=\"button\" data-rest=\"2\" aria-pressed=\"false\">2 beats<\/button>\n          <\/div>\n          <small>Gives the writer time to lift the pen and move to the next word.<\/small>\n        <\/div>\n      <\/div>\n      <div class=\"toggles\">\n        <label><input type=\"checkbox\" id=\"showBand\" checked> Show margin band<\/label>\n        <label><input type=\"checkbox\" id=\"showLabels\"> Label every stroke<\/label>\n        <label><input type=\"checkbox\" id=\"sound\" checked> Music on<\/label>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel music\" id=\"musicPanel\" aria-label=\"Music\">\n      <div class=\"music-head\">\n        <div><h2>Music<\/h2><p class=\"note\">Strokes land on the beats of whatever is playing.<\/p><\/div>\n        <div class=\"seg\" role=\"group\" aria-label=\"Music source\">\n          <button type=\"button\" data-src=\"synth\" aria-pressed=\"true\">Built-in beat<\/button>\n          <button type=\"button\" data-src=\"track\" aria-pressed=\"false\">My track<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"trackUI\" class=\"track-ui\" hidden>\n        <div class=\"track-row\">\n          <label class=\"btn\" for=\"trackFile\" id=\"uploadLbl\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 13.5h11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Upload MP3<\/label>\n          <input id=\"trackFile\" class=\"sr-only\" type=\"file\" accept=\"audio/*,.mp3,.wav,.m4a\">\n          <span class=\"note\" id=\"trackName\">No track yet. MP3, WAV or M4A, or drop a file on this panel.<\/span>\n        <\/div>\n        <div class=\"track-grid\">\n          <div class=\"ctl\">\n            <div class=\"ctl-row\"><label for=\"trackBpm\">Track BPM<\/label><\/div>\n            <div class=\"nudge\">\n              <input id=\"trackBpm\" class=\"num\" type=\"number\" min=\"1\" step=\"0.1\" value=\"100\">\n              <button type=\"button\" id=\"bpmHalf\" title=\"Half tempo\">½×<\/button>\n              <button type=\"button\" id=\"bpmDouble\" title=\"Double tempo\">2×<\/button>\n              <button type=\"button\" id=\"bpmDetect\">Detect<\/button>\n            <\/div>\n            <small id=\"bpmStatus\">Detected automatically when you upload. If it feels twice as fast or slow, use ½× or 2×. Above about 110 BPM, try 2 beats per stroke.<\/small>\n          <\/div>\n          <div class=\"ctl\">\n            <div class=\"ctl-row\"><label for=\"trackOffset\">First beat at<\/label><span class=\"val\" id=\"offVal\">auto<\/span><\/div>\n            <div class=\"nudge\">\n              <button type=\"button\" data-nudge=\"-0.05\">−50 ms<\/button><button type=\"button\" data-nudge=\"-0.01\">−10<\/button>\n              <input id=\"trackOffset\" class=\"num\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0\" aria-label=\"First beat time in seconds\">\n              <button type=\"button\" data-nudge=\"0.01\">+10<\/button><button type=\"button\" data-nudge=\"0.05\">+50 ms<\/button>\n            <\/div>\n            <small>Seconds into the song where beat 1 lands. Set automatically on upload. Click the waveform to move it.<\/small>\n          <\/div>\n        <\/div>\n        <div class=\"wave-wrap\"><canvas id=\"wave\" aria-label=\"Waveform with the beat grid. Click to set the first beat.\"><\/canvas><\/div>\n        <div class=\"track-row\">\n          <button type=\"button\" class=\"btn\" id=\"checkSync\">Check sync<\/button>\n          <div class=\"metro\" role=\"group\" aria-label=\"Metronome\">\n            <span class=\"metro-light\" aria-hidden=\"true\"><\/span>\n            <label class=\"inline\"><input type=\"checkbox\" id=\"metro\" checked> Metronome<\/label>\n            <span class=\"metro-bpm\" id=\"metroBpm\">no track<\/span>\n            <input type=\"range\" id=\"metroVol\" min=\"0\" max=\"100\" value=\"70\" aria-label=\"Metronome volume\" title=\"Metronome volume\">\n          <\/div>\n          <label class=\"inline\"><input type=\"checkbox\" id=\"ticks\"> Stroke ticks<\/label>\n          <span class=\"note\" id=\"trackInfo\"><\/span>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel test-admin\" id=\"testAdmin\" hidden>\n      <div><h2>Test attempt<\/h2><p class=\"note\" id=\"testAdminNote\"><\/p><\/div>\n      <button type=\"button\" class=\"btn\" id=\"resetTest\">Reset test attempt<\/button>\n    <\/section>\n\n    <section class=\"how\">\n      <div><h3>Letter → strokes<\/h3><p>Each letter is stored as an ordered list of strokes (lead-in, oval, downstroke, exit). Strokes join end to end, so a word is one continuous path cut at teaching points. Dots and crosses (i, j, t, x) come last, after the word is written. The pen lifts between words, and after capitals that don't join (B D F H I O P S T V W).<\/p><\/div>\n      <div><h3>Strokes → beats<\/h3><p>After a 4-beat count-in (the song's first 4 beats when you use your own track), each stroke owns a window of <code>b<\/code> beats, and each space between words is a rest of <code>r<\/code> beats with no stroke. The glowing dot travels the stroke at exactly that pace. In Practice, lift the pen or wander off the path and the music stops right there; put the pen back on the path and it carries on. In Test, the music keeps going no matter what. Rests play through on their own so there is time to move to the next word.<\/p><\/div>\n      <div><h3>Valid trace<\/h3><p>Ink is matched to the stroke whose window it fell in. A stroke is valid when ≥80% of the ink sits inside the margin, ≥70% of the stroke is covered, and ≥60% of the ink was on time.<\/p><\/div>\n    <\/section>\n  <\/section>\n\n  <\!-- ================= 2. WRITE ================= -->\n  <section class=\"view\" id=\"view-write\" hidden>\n    <div class=\"view-head\">\n      <div><p class=\"eyebrow\">Assignment<\/p><h1 id=\"lessonTitle\">Untitled lesson<\/h1><p class=\"note\" id=\"writeHint\"><\/p><\/div>\n    <\/div>\n\n    <div class=\"modes\" role=\"group\" aria-label=\"Writing mode\">\n      <button type=\"button\" class=\"mode\" id=\"demoBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M6.5 5.5v5l4-2.5z\" fill=\"currentColor\"/><\/svg>Watch demo<\/span>\n        <span class=\"md\">See the pace first. Watch as many times as you like.<\/span>\n        <span class=\"badge\" id=\"demoBadge\">Start here<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"pracBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 12.5l2-5 6-4.5 2 2-4.5 6z M3 12.5l3.5-1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\/svg>Practice<\/span>\n        <span class=\"md\" id=\"pracMd\">The music follows your pen. It stops when you lift and waits for you.<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"testBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M6 12.5V4l7-1.5v8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><circle cx=\"4.5\" cy=\"12.5\" r=\"1.8\" fill=\"currentColor\"/><circle cx=\"11.5\" cy=\"11\" r=\"1.8\" fill=\"currentColor\"/><\/svg><span id=\"testTitle\">Test<\/span><\/span>\n        <span class=\"md\" id=\"testMd\">You follow the music. It keeps going no matter what. One try only.<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"checkBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 12.5l2-5 6-4.5 2 2-4.5 6z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M2.5 14.5h11\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\/svg>On your own<\/span>\n        <span class=\"md\">No music and no beat. Write it at your own pace. This is the one that shows what you have learned.<\/span>\n      <\/button>\n    <\/div>\n\n    <div class=\"write-bar\">\n      <span class=\"note\" id=\"writeWord\"><\/span>\n      <button class=\"btn primary\" id=\"checkDone\" type=\"button\" hidden>Score my writing<\/button>\n      <\!-- FW-THEMES:BEGIN -->\n      <label class=\"skin-pick\">\n        <span class=\"sw\" aria-hidden=\"true\"><\/span>\n        <select id=\"skinSel\" aria-label=\"Writing surface\">\n          <option value=\"\">Plain paper<\/option>\n        <option value=\"classroom\">Classroom<\/option>\n        <option value=\"space\">Space station<\/option>\n        <option value=\"treehouse\">Treehouse<\/option>\n        <option value=\"submarine\">Submarine<\/option>\n        <option value=\"study\">Wizard study<\/option>\n        <option value=\"studio\">Art studio<\/option>\n        <option value=\"campfire\">Night camp<\/option>\n        <\/select>\n      <\/label>\n      <\!-- FW-THEMES:END -->\n      <button class=\"btn\" id=\"clearBtn\" type=\"button\">Clear<\/button>\n    <\/div>\n\n    <div id=\"stageSlotW\">\n      <section class=\"stage\" id=\"stage\">\n        <canvas id=\"pad\" aria-label=\"Tracing area. Draw with a finger, stylus or mouse.\"><\/canvas>\n        <div class=\"hud\">\n          <span class=\"pill\" id=\"hudLeft\">Sample attempt<\/span>\n          <span class=\"pill\" id=\"hudPen\"><span class=\"dot\"><\/span><span id=\"hudPenTxt\">Pen up<\/span><\/span>\n        <\/div>\n        <div class=\"pager\" id=\"pager\" hidden>\n          <button type=\"button\" class=\"pg-btn\" id=\"pgPrev\" aria-label=\"Previous page\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M10 3L5 8l5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n          <div class=\"pg-mid\" aria-live=\"polite\"><span id=\"pageTxt\">Page 1 of 1<\/span><span class=\"pg-dots\" id=\"pgDots\" aria-hidden=\"true\"><\/span><\/div>\n          <button type=\"button\" class=\"pg-btn\" id=\"pgNext\" aria-label=\"Next page\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M6 3l5 5-5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n        <\/div>\n      <\/section>\n    <\/div>\n\n    <div class=\"wave-wrap\" id=\"waveWWrap\" hidden>\n      <div class=\"wave-head\"><span class=\"metro-light\" aria-hidden=\"true\"><\/span><span id=\"waveWName\"><\/span><\/div>\n      <canvas id=\"waveW\" aria-label=\"Waveform of your track with the beat grid\"><\/canvas>\n    <\/div>\n\n    <div id=\"mapSlotW\">\n      <section class=\"beatmap\" id=\"beatmap\">\n        <div class=\"beatmap-head\">\n          <h2>Beat map<\/h2>\n          <p id=\"beatmapNote\">4-beat count-in, then one stroke per beat. Tap a stroke to inspect it.<\/p>\n        <\/div>\n        <div class=\"lane-scroll\"><div class=\"lane\" id=\"lane\"><\/div><\/div>\n      <\/section>\n    <\/div>\n\n    <div class=\"foot-actions\">\n      <button class=\"btn teacher-only\" type=\"button\" data-go=\"setup\">Back to setup<\/button>\n      <button class=\"btn\" type=\"button\" data-go=\"results\" id=\"seeResults\">See test results<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n    <\/div>\n  <\/section>\n\n  <\!-- ================= 3. RESULTS ================= -->\n  <section class=\"view\" id=\"view-results\" hidden>\n    <div class=\"view-head\">\n      <div><p class=\"eyebrow\" id=\"lessonTitleR\"><\/p><h1>Test results<\/h1><p class=\"note\">The test is submitted and can't be taken again. You can still watch the demo and practice.<\/p><p class=\"run\" id=\"runInfo\"><\/p><\/div>\n      <div class=\"foot-actions\">\n        <button class=\"btn\" type=\"button\" data-go=\"write\">Back to lesson<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"res-top\">\n      <section class=\"panel\" aria-label=\"Score\" aria-live=\"polite\">\n        <div class=\"score\"><span class=\"big\" id=\"scoreBig\">0<\/span><span class=\"of\" id=\"scoreOf\">of 12 strokes valid<\/span><\/div>\n        <div class=\"meter\" id=\"meter\" aria-hidden=\"true\"><\/div>\n        <div class=\"legend\" id=\"legend\"><\/div>\n      <\/section>\n      <section class=\"panel\" aria-label=\"Breakdown\">\n        <h2>Across all traced strokes<\/h2>\n        <div class=\"metrics\" id=\"avgs\"><\/div>\n        <div class=\"issues\" id=\"issues\"><\/div>\n      <\/section>\n    <\/div>\n\n    <div id=\"stageSlotR\"><\/di ear':'weak beat, check by ear';\n  st.textContent=named?`${fmtBpm(res.bpm)} BPM from the file name · beat grid aligned to the audio.`\n    :`Detected ${fmtBpm(res.bpm)} BPM (${sure}). If it feels twice as fast or slow, use ½× or 2×.`;\n  if(res.conf<1.35&&!named) st.classList.add('warn');\n  applySource();\n}\nfunction setOffset(v,auto){\n  if(!S.track) return;\n  S.track.offset=Math.max(0,Math.min(S.track.duration-.5,Math.round(v*1000)/1000));\n  $('trackOffset').value=S.track.offset.toFixed(2);\n  $('offVal').textContent=S.track.offset.toFixed(2)+' s'+(auto?' · auto':'');\n  if(S.track) $('waveWName').innerHTML=`<b>${esc(S.track.name)}<\/b> · ${fmtBpm(S.track.bpm)} BPM · beat 1 at ${S.track.offset.toFixed(2)} s`;\n  drawWave(); updateTrackInfo();\n}\nasync function loadFile(file){\n  if(!file) return;\n  ensureAudio();\n  if(!actx){ flashTrackNote('This browser cannot play audio files here.'); return; }\n  S.src='track'; applySource();\n  $('trackName').textContent='Reading '+file.name+'…';\n  try{\n    const ab=await file.arrayBuffer();\n    const buf=await new Promise((res,rej)=>{ const p=actx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });\n    S.track={buf,name:file.name,bpm:+$('trackBpm').value||100,offset:0,duration:buf.duration};\n    waveCache={};\n    $('trackName').classList.remove('warn');\n    $('trackName').innerHTML=`<b>${esc(file.name)}<\/b> · ${fmtTime(buf.duration)}`;\n    setOffset(detectFirstBeat(buf),true);\n    applySource();\n    await runDetect(false); // \"song_120bpm.mp3\" uses 120 from the name; otherwise the tempo is detected\n  }catch(e){ S.track=null; flashTrackNote('That file could not be read as audio. Try an MP3 or WAV.'); }\n}\n// The waveform shows on the setup page (click to set beat 1) and on the writing page (with a playhead)\nfunction drawWave(playPos){ ['wave','waveW'].forEach(id=>drawWaveOn($(id),playPos)); }\nfunction drawWaveOn(cvw,playPos){\n  if(!cvw) return;\n  const w=cvw.clientWidth, h=104, d=window.devicePixelRatio||1; if(!w) return;\n  if(cvw.width!==Math.round(w*d)){ cvw.width=Math.round(w*d); cvw.height=Math.round(h*d); delete waveCache[cvw.id]; }\n  const g=cvw.getContext('2d'); g.setTransform(d,0,0,d,0,0);\n  g.fillStyle=C.sheet; g.fillRect(0,0,w,h);\n  if(!S.track){ g.fillStyle=C.muted; g.font='13px \"Atkinson Hyperlegible\", system-ui, sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('Your track’s waveform and beat grid will show here',w/2,h/2); return; }\n  const T=S.track, sp=60/T.bpm, v0=Math.max(0,T.offset-1.5), v1=Math.min(T.duration,Math.max(v0+4,T.offset+sp*(COUNT_IN+8)+.5));\n  const key=[w,v0.toFixed(3),v1.toFixed(3)].join();\n  let pc=waveCache[cvw.id];\n  if(!pc||pc.key!==key){\n    const ch=T.buf.getChannelData(0), sr=T.buf.sampleRate, arr=new Float32Array(Math.ceil(w)); let mx=1e-6;\n    for(let x=0;x<arr.length;x++){ const a=Math.floor((v0+(v1-v0)*x/w)*sr), b=Math.min(ch.length,Math.floor((v0+(v1-v0)*(x+1)/w)*sr)); let p=0; for(let i=a;i<b;i+=4){ const v=Math.abs(ch[i]); if(v>p) p=v; } arr[x]=p; if(p>mx) mx=p; }\n    for(let x=0;x<arr.length;x++) arr[x]/=mx;\n    pc=waveCache[cvw.id]={key,arr};\n  }\n  const X=t=>(t-v0)/(v1-v0)*w, mid=h/2+8;\n  g.fillStyle=C.muted; g.globalAlpha=.4;\n  pc.arr.forEach((p,x)=>{ const a=Math.max(.5,p*(h*.36)); g.fillRect(x,mid-a,1,a*2); });\n  g.globalAlpha=1;\n  // intro before beat 1\n  const xo=X(T.offset); if(xo>0){ g.fillStyle=C.sheet; g.globalAlpha=.55; g.fillRect(0,0,xo,h); g.globalAlpha=1; }\n  g.font='500 11px \"DM Mono\", ui-monospace, monospace'; g.textBaseline='top';\n  for(let i=0;;i++){\n    const t=T.offset+i*sp; if(t>v1) break; const x=X(t);\n    const isCount=i<COUNT_IN, first=i===COUNT_IN;\n    g.strokeStyle=isCount?C.muted:C.accent; g.lineWidth=first?2.5:(i===0?2:1.2); g.setLineDash(isCount?[3,3]:[]);\n    g.beginPath(); g.moveTo(x,18); g.lineTo(x,h); g.stroke(); g.setLineDash([]);\n    g.fillStyle=isCount?C.muted:C.accent; g.textAlign=first?'left':'center';\n    const lbl=isCount?String(COUNT_IN-i):first?'first stroke':'';\n    if(lbl) g.fillText(lbl,first?x+4:x,4);\n  }\n  { const lbl=g.measureText('intro · count-in →').width+18<xo?'intro · count-in →':g.measureText('intro →').width+14<xo?'intro →':'';\n    if(lbl){ g.fillStyle=C.muted; g.textAlign='right'; g.fillText(lbl,xo-8,4); } }\n  if(playPos!=null&&playPos>=v0&&playPos<=v1){ const x=X(playPos); g.strokeStyle=C.ink; g.lineWidth=2; g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke(); }\n}\nfunction stopCheck(){\n  if(!checking) return; checking=false; cancelAnimationFrame(checkRaf); clearTimeout(checkTimer);\n  stopTrack(.12); $('checkSync').textContent='Check sync'; drawWave(); metroLight(null);\n}\nfunction checkSync(){\n  if(!S.track) return; ensureAudio(); if(!actx) return;\n  stopCheck();\n  const T=S.track, sp=60/T.bpm, lead=Math.min(1,T.offset), t=actx.currentTime+.1, beats=8;\n  playTrack(t,T.offset-lead,0);\n  for(let i=0;i<beats;i++) metroClick(t+lead+i*sp,i%4===0,metroGain);\n  checking=true; $('checkSync').textContent='Stop check';\n  const endT=t+lead+beats*sp+.25;\n  const loop=()=>{ if(!checking) return; const now=actx.currentTime; drawWave(T.offset-lead+(now-t)); metroLight((now-t-lead)/sp); if(now<endT) checkRaf=requestAnimationFrame(loop); else stopCheck(); };\n  loop();\n}\ndocument.querySelectorAll('[data-src]').forEach(b=>b.addEventListener('click',()=>{ stopCheck(); S.src=b.dataset.src; applySource(); }));\n$('trackFile').addEventListener('change',e=>{ stopCheck(); loadFile(e.target.files[0]); e.target.value=''; });\n$('trackBpm').addEventListener('input',e=>{\n  const v=+e.target.value; if(!(v>0)||!isFinite(v)) return;\n  if(S.track){ S.track.bpm=v; waveCache={}; } applySource();\n});\n$('trackOffset').addEventListener('change',e=>setOffset(+e.target.value||0));\nconst scaleBpm=f=>{ if(!S.track) return; const v=Math.round(S.track.bpm*f*100)/100; if(!(v>0)||!isFinite(v)) return; // no cap: ½× and 2× can be pressed as often as you like\n  S.track.bpm se start('test');\n});\n$('clearBtn').addEventListener('click',()=>{ if(S.checking&&S.testMode) return; if(S.checking){ clearAttempt(); syncUI(); render(); return; } if(S.playing){ if(S.mode==='test'){ finish(); return; } stop(); } clearAttempt(); S.lastRun=null; syncUI(); render(); });\n\nnew ResizeObserver(()=>{\n  if(!stage.clientWidth) return; // hidden on the setup page\n  // re-wrap sentences when the width changes enough to move a line break (never mid-attempt)\n  const nw=wrapFor(stage.clientWidth);\n  if(!S.playing && S.strokes.length && nw!==S.wrap){\n    const before=JSON.stringify(wrapLines(S.word,S.wrap)), after=JSON.stringify(wrapLines(S.word,nw));\n    S.wrap=nw;\n    if(before!==after){ S.strokes=buildWord(S.word); layout(); buildLane(); freshModel(); syncUI(); render(); return; }\n  }\n  layout(); render(); drawWave();\n}).observe(stage);\nnew ResizeObserver(()=>drawWave()).observe(mainEl);\nconst refreshTheme=()=>{ readColors(); layout(); renderResults(); render(); drawWave(); };\nmatchMedia('(prefers-color-scheme: dark)').addEventListener('change',refreshTheme);\nnew MutationObserver(refreshTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-skin']});\nif(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>render());\n\n// ---------- Light / dark toggle ----------\nconst darkMQ=matchMedia('(prefers-color-scheme: dark)'), rootEl=document.documentElement;\nconst isDark=()=>rootEl.dataset.theme?rootEl.dataset.theme==='dark':darkMQ.matches;\nconst SUN='<svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><circle cx=\"10\" cy=\"10\" r=\"3.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"/><path d=\"M10 1.8v2.2M10 16v2.2M1.8 10H4M16 10h2.2M4.2 4.2l1.6 1.6M14.2 14.2l1.6 1.6M4.2 15.8l1.6-1.6M14.2 5.8l1.6-1.6\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><\/svg>';\nconst MOON='<svg viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M16.5 12.3A7 7 0 0 1 7.7 3.5a7 7 0 1 0 8.8 8.8z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"/><\/svg>';\nfunction paintThemeBtn(){ const d=isDark(), b=$('themeBtn'); b.innerHTML=d?SUN:MOON; const l=d?'Switch to light mode':'Switch to dark mode'; b.setAttribute('aria-label',l); b.title=l; }\n$('themeBtn').addEventListener('click',()=>{ const t=isDark()?'light':'dark'; rootEl.dataset.theme=t; try{ localStorage.setItem('flowriter-theme',t); }catch(e){} paintThemeBtn(); });\ndarkMQ.addEventListener('change',paintThemeBtn);\npaintThemeBtn();\n\n// ---------- Assignment: lesson name, lock, one test ----------\nfunction saveTest(){\n  S.testSnap={run:S.lastRun, res:S.strokes.map(s=>s.res), points:S.points.map(p=>({...p})), score:attemptScore(), untimed:S.attemptUntimed};\n  S.testDone=true;\n}\nfunction restoreTest(){\n  const snap=S.testSnap;\n  S.points=snap.points.map(p=>({...p}));\n  S.strokes.forEach((s,i)=>s.res=snap.res[i]||{status:'missed',score:0,path:0,ink:0,onTime:0,n:0});\n  S.lastRun=snap.run; S.sample=false; S.finished=true; S.attemptUntimed=!!snap.untimed;\n  const bad=S.strokes.findIndex(s=>s.res.status!=='valid'); S.selected=bad>=0?bad:0;\n}\n$('resetTest').addEventListener('click',()=>{ S.testDone=false; S.testSnap=null; syncUI(); });\nfunction paintLesson(){\n  const t=S.lesson.trim()||'Untitled lesson';\n  $('lessonTitle').textContent=t; $('lessonTitleR').textContent=t; document.title=t+' · Flowriter';\n}\n$('lessonName').addEventListener('input',e=>{ S.lesson=e.target.value; paintLesson(); });\nconst LOCK='<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M5.5 7V5a2.5 2.5 0 0 1 5 0v2\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><\/svg>';\nconst UNLOCK='<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M5.5 7V5a2.5 2.5 0 0 1 4.9-.7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\/svg>';\nfunction paintLock(){\n  const b=$('lockBtn');\n  document.body.classList.toggle('locked',S.locked); b.classList.toggle('on',S.locked);\n  b.innerHTML=S.locked?LOCK+'Student view · Unlock':UNLOCK+'Lock for students';\n  b.title=S.locked?'Unlock to edit the assignment again':'Hide the setup page, as students see it';\n  document.querySelectorAll('.step .sn').forEach((n,i)=>n.textContent=S.locked?i:i+1);\n}\n$('lockBtn').addEventListener('click',()=>{\n  if(S.playing) return;\n  S.locked=!S.locked; paintLock();\n  if(S.locked&&S.view==='setup') showView('write');\n});\npaintLock(); paintLesson();\n\nreadColors();\n\n\n// FW-THEMES:BEGIN ---------- Writing-surface themes ----------\n// Cosmetic only: sets a data attribute. The palette is scoped to .stage in CSS,\n// and the existing attribute observer re-reads colours and re-lays-out, which\n// matters because the frame's border width changes the canvas's content box.\nconst SKIN_KEY='flowriter-skin', SKIN_DEFAULT='classroom';\nfunction applySkin(v){\n  if(v) document.documentElement.dataset.skin=v;\n  else document.documentElement.removeAttribute('data-skin');\n  const s=$('skinSel'); if(s&&s.value!==v) s.value=v;\n  try{ localStorage.setItem(SKIN_KEY,v); }catch(e){}\n}\n$('skinSel').addEventListener('change',e=>applySkin(e.target.value));\n(()=>{ let v=SKIN_DEFAULT;\n  try{ const stored=localStorage.getItem(SKIN_KEY); if(stored!==null) v=stored; }catch(e){}\n  if(window.__FW&&window.__FW.skin!=null) v=window.__FW.skin===true?SKIN_DEFAULT:(window.__FW.skin||'');\n  if(v&&!$('skinSel').querySelector(`[value=\"${v}\"]`)) v=SKIN_DEFAULT;\n  applySkin(v); })();\n// FW-THEMES:END\n// ---------- Host glue (the FloWriter app) ----------\nfunction snapshot(w0=720,q=.72){\n  // every page of the attempt, stacked, as one small JPEG for the teacher\n  try{\n    const keep=S.page, w=w0, pages=[];\n    for(let p=0;p<S.pages;p++){ S.page=p; render(); const c=document.createElement('canvas'); c.width=w; c.height=Math.round(cv.height*w/cv.width); c.getContext('2d').drawImage(cv,0,0,c.width,c.height); pages.push(c); }\n    S.page=keep; render();\n    const out=document.createElement('canvas'); out.width=w; out.height=pages.reduce((a,c)=>a+c.height,0);\n    const g=out.getContext('2d'); let y=0; pages.forEach(c=>{ g.drawImage(c,0,y); y+=c.height; });\n    return out.toDataURL('image/jpeg',q);\n  }catch(e){ return null; }\n}\nfunction emitRun(mode){\n  if(!PILOT) return;\n  const by=new Map();\n  S.strokes.forEach(s=>{ let e=by.get(s.ch); if(!e) by.set(s.ch,e={ch:s.ch,sum:0,n:0,rev:0}); e.sum+=s.res?s.res.score:0; e.n++; if(s.res&&s.res.status==='reversed') e.rev++; });\n  const letters=[...by.values()].map(e=>({ch:e.ch,score:Math.round(e.sum/e.n*1000)/1000,n:e.n,rev:e.rev}));\n  const valid=S.strokes.filter(s=>s.res&&s.res.status==='valid').length, reversed=S.strokes.filter(s=>s.res&&s.res.status==='reversed').length;\n  emit({type:'run',mode:mode==='check'?'test':mode,score:mode==='demo'?null:Math.round(attemptScore()*1000)/1000,valid,total:S.strokes.length,reversed,\n    gate:mode==='practice'?S.gate:null,bpm:mode==='test'||mode==='check'?null:S.bpm,pauses:S.pauses,letters,img:mode==='demo'?null:mode==='practice'?snapshot(420,.6):snapshot()});\n}\nasync function hostTrack(m){\n  ensureAudio();\n  if(!actx){ emit({type:'trackFail'}); return; }\n  try{\n    const ab=await m.track.arrayBuffer();\n    const buf=await new Promise((res,rej)=>{ const p=actx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); });\n    S.track={buf,name:m.name||m.track.name||'Song',bpm:+m.bpm||100,baseBpm:+m.baseBpm||+m.bpm||100,offset:0,duration:buf.duration};\n    waveCache={}; S.src='track';\n    if(m.offset!=null) setOffset(+m.offset,true); else setOffset(detectFirstBeat(buf),true);\n    if(!m.bpm) await runDetect(false);\n    applySource(); timing(); buildLane(); syncUI(); render();\n    emit({type:'trackReady',bpm:S.track.bpm});\n  }catch(e){ S.track=null; S.src='synth'; applySource(); emit({type:'trackFail'}); }\n}\nfunction applyHost(){\n  const c=HOST; document.body.classList.add('pilot', 'role-'+(c.role||'student'));\n  if(c.theme) document.documentElement.dataset.theme=c.theme;\n  if(c.title){ S.lesson=c.title; paintLesson(); }\n  if(c.tol){ S.tol=c.tol/100; $('tol').value=c.tol; $('tolVal').textContent=c.tol+'% of x-height'; }\n  if(c.bps){ S.bps=+c.bps; document.querySelectorAll('.seg button[data-bps]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.bps===S.bps))); }\n  if(c.rest!=null){ S.rest=+c.rest; document.querySelectorAll('.seg button[data-rest]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.rest===S.rest))); }\n  if(c.bpm){ const v=Math.max(1,+c.bpm); const r=$('bpm'); r.value=v; S.bpm=v; $('bpmVal').textContent=fmtBpm(v)+' BPM'; }\n  S.locked=true; paintLock();\n  applySkin(c.skin||'');\n  if(c.checkOnly) document.body.classList.add('check-only');\n  S.left=c.handed==='left';\n  // sound: music on/off, metronome on/off, volume. Remembered on this device.\n  try{ const v=JSON.parse(localStorage.getItem('flowriter-sound')||'null'); if(v){ S.sound=v.sound!==false; S.metro=v.metro!==false; S.vol=Math.max(0,Math.min(1,+v.vol||1)); } }catch(e){}\n  if(!c.checkOnly){\n    const bar=document.querySelector('.write-bar'), box=document.createElement('div'); box.className='sound-ctl'; box.setAttribute('role','group'); box.setAttribute('aria-label','Sound');\n    box.innerHTML=`<button type=\"button\" id=\"sndMusic\" aria-pressed=\"${S.sound}\">♪ Music<\/button><button type=\"button\" id=\"sndClick\" aria-pressed=\"${S.metro}\">Click<\/button><label style=\"display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:14px\">Volume <input type=\"range\" id=\"sndVol\" min=\"0\" max=\"100\" value=\"${Math.round(S.vol*100)}\" aria-label=\"Volume\"><\/label>`;\n    bar.insertBefore(box,$('clearBtn'));\n    const save=()=>{ try{ localStorage.setItem('flowriter-sound',JSON.stringify({sound:S.sound,metro:S.metro,vol:S.vol})); }catch(e){} };\n    $('sndMusic').addEventListener('click',e=>{ S.sound=!S.sound; e.currentTarget.setAttribute('aria-pressed',S.sound); $('sound').checked=S.sound; applyLevels(); save(); });\n    $('sndClick').addEventListener('click',e=>{ S.metro=!S.metro; e.currentTarget.setAttribute('aria-pressed',S.metro); $('metro').checked=S.metro; if(flowMetro&&actx) flowMetro.gain.setTargetAtTime(S.metro?S.metroVol:0,actx.currentTime,.02); save(); });\n    $('sndVol').addEventListener('input',e=>{ S.vol=e.target.value/100; applyLevels(); save(); });\n    $('sound').checked=S.sound; $('metro').checked=S.metro;\n  }\n  setWord(c.word||'hello'); // resets any test state, so progress goes on after it\n  const pr=c.progress||{};\n  if(pr.demo) S.demoWatched=true;\n  if(pr.practice) S.practiceRuns=+pr.practice;\n  if(pr.test&&c.role!=='preview'){ S.testDone=true; S.testSnap=null; }\n  applySource(); showView('write');\n  addEventListener('message',e=>{\n    const m=e.data||{}; if(!m.fwShell) return;\n    if(m.theme) document.documentElement.dataset.theme=m.theme;\n    if(m.track) hostTrack(m);\n  });\n  const sendH=()=>emit({type:'h',h:Math.ceil(document.documentElement.scrollHeight)});\n  new ResizeObserver(sendH).observe(document.body); sendH();\n  ['setup','write','results'].forEach(v=>{ const el=$('view-'+v); el&&new MutationObserver(()=>{ if(!el.hidden) emit({type:'view',v}); sendH(); }).observe(el,{attributes:true,attributeFilter:['hidden']}); });\n  let lastPing=0;\n  cv.addEventListener('pointermove',()=>{ const n=Date.now(); if(n-lastPing>5000){ lastPing=n; emit({type:'active'}); } });\n  if(c.debug) window.__fw={S,X:u=>X(u),Y:v=>Y(v),attemptScore,loopRegion,wrapPos,get scale(){return scale;},get H(){return H;},startCheck,finishCheck};\n  emit({type:'ready'});\n}\nif(PILOT) applyHost();\nelse { setWord('hello'); applySource(); }\n})();\n<\/script>\n<\/body>\n<\/html>\n";

      const P = s.ctrl, n = P.length;

  }

})();
