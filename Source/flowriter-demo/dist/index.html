foot-actions\">\n        <span class=\"note\" id=\"setupSummary\"><\/span>\n        <button class=\"btn primary\" type=\"button\" data-go=\"write\">Continue to writing<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"composer\" id=\"composer\">\n      <div class=\"composer-head\">\n        <label for=\"customWord\">What to write<\/label>\n        <span>Press Enter to write it out<\/span>\n      <\/div>\n      <div class=\"composer-box\">\n        <svg class=\"pen\" viewBox=\"0 0 20 20\" aria-hidden=\"true\"><path d=\"M13.5 3.5l3 3L7 16H4v-3z M11.5 5.5l3 3\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\/svg>\n        <textarea id=\"customWord\" rows=\"1\" maxlength=\"300\" placeholder=\"Type a word, a sentence, or a whole paragraph…\" autocomplete=\"off\" spellcheck=\"false\"><\/textarea>\n        <button type=\"button\" class=\"composer-clear\" id=\"customClear\" aria-label=\"Clear text\" hidden><svg viewBox=\"0 0 12 12\" aria-hidden=\"true\"><path d=\"M2 2l8 8M10 2l-8 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><\/svg><\/button>\n      <\/div>\n      <div class=\"composer-foot\">\n        <span class=\"allowed\">Letters A to Z and <kbd>.<\/kbd><kbd>,<\/kbd><kbd>!<\/kbd><kbd>?<\/kbd><kbd>'<\/kbd><\/span>\n        <span class=\"meta\"><span id=\"charCount\">0 / 300<\/span> · <span id=\"pageInfo\">1 page<\/span><\/span>\n      <\/div>\n    <\/div>\n\n    <section class=\"panel\" aria-label=\"Settings\">\n      <h2>Pacing and scoring<\/h2>\n      <div class=\"settings-grid\">\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label for=\"bpm\">Tempo<\/label><span class=\"val\" id=\"bpmVal\">84 BPM<\/span><\/div>\n          <input id=\"bpm\" type=\"range\" min=\"60\" max=\"140\" step=\"1\" value=\"84\">\n          <small>Slower tempos give younger writers more time per stroke.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label for=\"tol\">Margin of error<\/label><span class=\"val\" id=\"tolVal\">18% of x-height<\/span><\/div>\n          <input id=\"tol\" type=\"range\" min=\"6\" max=\"40\" step=\"1\" value=\"18\">\n          <small>How far the child's line can stray from the model and still count. Drag it after an attempt to see strokes re-score.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"gateLbl\">Practice help<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"gateLbl\">\n            <button type=\"button\" data-gate=\"hold\" aria-pressed=\"true\">Waits<\/button>\n            <button type=\"button\" data-gate=\"duck\" aria-pressed=\"false\">Quiets<\/button>\n            <button type=\"button\" data-gate=\"off\" aria-pressed=\"false\">None<\/button>\n          <\/div>\n          <label class=\"inline\" style=\"margin-top:6px\"><input type=\"checkbox\" id=\"gateFade\" checked> Fade the help as the word is practised<\/label>\n          <small>Waits: the music stops until the pen is back. Quiets: it keeps playing but thins out. Fading moves from waits to quiets to none, so the writing does not lean on the music.<\/small>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"bpsLbl\">Beats per stroke<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"bpsLbl\">\n            <button type=\"button\" data-bps=\"1\" aria-pressed=\"true\">1 beat<\/button>\n            <button type=\"button\" data-bps=\"2\" aria-pressed=\"false\">2 beats<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"ctl\">\n          <div class=\"ctl-row\"><label id=\"restLbl\">Rest for each space<\/label><\/div>\n          <div class=\"seg\" role=\"group\" aria-labelledby=\"restLbl\">\n            <button type=\"button\" data-rest=\"0\" aria-pressed=\"false\">None<\/button>\n            <button type=\"button\" data-rest=\"1\" aria-pressed=\"true\">1 beat<\/button>\n            <button type=\"button\" data-rest=\"2\" aria-pressed=\"false\">2 beats<\/button>\n          <\/div>\n          <small>Gives the writer time to lift the pen and move to the next word.<\/small>\n        <\/div>\n      <\/div>\n      <div class=\"toggles\">\n        <label><input type=\"checkbox\" id=\"showBand\" checked> Show margin band<\/label>\n        <label><input type=\"checkbox\" id=\"showLabels\"> Label every stroke<\/label>\n        <label><input type=\"checkbox\" id=\"sound\" checked> Music on<\/label>\n      <\/div>\n    <\/section>\n\n    <section class=\"panel music\" id=\"musicPanel\" aria-label=\"Music\">\n      <div class=\"music-head\">\n        <div><h2>Music<\/h2><p class=\"note\">Strokes land on the beats of whatever is playing.<\/p><\/div>\n        <div class=\"seg\" role=\"group\" aria-label=\"Music source\">\n          <button type=\"button\" data-src=\"synth\" aria-pressed=\"true\">Built-in beat<\/button>\n          <button type=\"button\" data-src=\"track\" aria-pressed=\"false\">My track<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"trackUI\" class=\"track-ui\" hidden>\n        <div class=\"track-row\">\n          <label class=\"btn\" for=\"trackFile\" id=\"uploadLbl\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 13.5h11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg>Upload MP3<\/label>\n          <input id=\"trackFile\" class=\"sr-only\" type=\"file\" accept=\"audio/*,.mp3,.wav,.m4a\">\n          <span class=\"note\" id=\"trackName\">No track yet. MP3, WAV or M4A, or drop a file on this panel.<\/span>\n        <\/div>\n        <div class=\"track-grid\">\n          <div class=\"ctl\">\n            <div class=\"ctl-row\"><label for=\"trackBpm\">Track BPM<\/label><\/div>\n            <div class=\"nudge\">\n              <input id=\"trackBpm\" class=\"num\" type=\"number\" min=\"40\" max=\"220\" step=\"0.1\" value=\"100\">\n              <button type=\"button\" id=\"bpmHalf\" title=\"Half tempo\">½×<\/button>\n              <button type=\"button\" id=\"bpmDouble\" title=\"Double tempo\">2×<\/button>\n              <button type=\"button\" id=\"bpmDetect\">Detect<\/button>\n            <\/div>\n            <small id=\"bpmStatus\">Detected automatically when you upload. If it feels twice as fast or slow, use ½× or 2×. Above about 110 BPM, try 2 beats per stroke.<\/small>\n          <\/div>\n          <div class=\"ctl\">\n            <div class=\"ctl-row\"><label for=\"trackOffset\">First beat at<\/label><span class=\"val\" id=\"offVal\">auto<\/span><\/div>\n            <div class=\"nudge\">\n              <button type=\"button\" data-nudge=\"-0.05\">−50 ms<\/button><button type=\"button\" data-nudge=\"-0.01\">−10<\/button>\n              <input id=\"trackOffset\" class=\"num\" type=\"number\" min=\"0\" step=\"0.01\" value=\"0\" aria-label=\"First beat time in seconds\">\n              <button type=\"button\" data-nudge=\"0.01\">+10<\/button><button type=\"button\" data-nudge=\"0.05\">+50 ms<\/button>\n            <\/div>\n            <small>Seconds into the song where beat 1 lands. Set automatically on upload. Click the waveform to move it.<\/small>\n          <\/div>\n        <\/div>\n        <div class=\"wave-wrap\"><canvas id=\"wave\" aria-label=\"Waveform with the beat grid. Click to set the first beat.\"><\/canvas><\/div>\n        <div class=\"track-row\">\n          <button type=\"button\" class=\"btn\" id=\"checkSync\">Check sync<\/button>\n          <div class=\"metro\" role=\"group\" aria-label=\"Metronome\">\n            <span class=\"metro-light\" aria-hidden=\"true\"><\/span>\n            <label class=\"inline\"><input type=\"checkbox\" id=\"metro\" checked> Metronome<\/label>\n            <span class=\"metro-bpm\" id=\"metroBpm\">no track<\/span>\n            <input type=\"range\" id=\"metroVol\" min=\"0\" max=\"100\" value=\"70\" aria-label=\"Metronome volume\" title=\"Metronome volume\">\n          <\/div>\n          <label class=\"inline\"><input type=\"checkbox\" id=\"ticks\"> Stroke ticks<\/label>\n          <span class=\"note\" id=\"trackInfo\"><\/span>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"how\">\n      <div><h3>Letter → strokes<\/h3><p>Each letter is stored as an ordered list of strokes (lead-in, oval, downstroke, exit). Strokes join end to end, so a word is one continuous path cut at teaching points. Dots and crosses (i, j, t, x) come last, after the word is written. The pen lifts between words, and after capitals that don't join (B D F H I O P S T V W).<\/p><\/div>\n      <div><h3>Strokes → beats<\/h3><p>After a 4-beat count-in (the song's first 4 beats when you use your own track), each stroke owns a window of <code>b<\/code> beats, and each space between words is a rest of <code>r<\/code> beats with no stroke. The glowing dot travels the stroke at exactly that pace. In Practice, lift the pen or wander off the path and the music stops right there; put the pen back on the path and it carries on. In Test, the music keeps going no matter what. Rests play through on their own so there is time to move to the next word.<\/p><\/div>\n      <div><h3>Valid trace<\/h3><p>Ink is matched to the stroke whose window it fell in. A stroke is valid when ≥80% of the ink sits inside the margin, ≥70% of the stroke is covered, and ≥60% of the ink was on time.<\/p><\/div>\n    <\/section>\n  <\/section>\n\n  <\!-- ================= 2. WRITE ================= -->\n  <section class=\"view\" id=\"view-write\" hidden>\n    <div class=\"view-head\">\n      <div><h1>Write<\/h1><p class=\"note\" id=\"writeHint\">Watch the demo first, as many times as you like. Then practice with training wheels, or take the test.<\/p><\/div>\n    <\/div>\n\n    <div class=\"modes\" role=\"group\" aria-label=\"Writing mode\">\n      <button type=\"button\" class=\"mode\" id=\"demoBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"M6.5 5.5v5l4-2.5z\" fill=\"currentColor\"/><\/svg>Watch demo<\/span>\n        <span class=\"md\">See the pace first. Watch as many times as you like.<\/span>\n        <span class=\"badge\" id=\"demoBadge\">Start here<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"pracBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 12.5l2-5 6-4.5 2 2-4.5 6z M3 12.5l3.5-1.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><\/svg>Practice<\/span>\n        <span class=\"md\">The music follows your pen. It stops when you lift and waits for you.<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"testBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M6 12.5V4l7-1.5v8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><circle cx=\"4.5\" cy=\"12.5\" r=\"1.8\" fill=\"currentColor\"/><circle cx=\"11.5\" cy=\"11\" r=\"1.8\" fill=\"currentColor\"/><\/svg>Test<\/span>\n        <span class=\"md\">You follow the music. It keeps going no matter what.<\/span>\n      <\/button>\n      <button type=\"button\" class=\"mode\" id=\"checkBtn\">\n        <span class=\"mt\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 12.5l2-5 6-4.5 2 2-4.5 6z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><path d=\"M2.5 14.5h11\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"/><\/svg>On your own<\/span>\n        <span class=\"md\">No music and no beat. Write it at your own pace. This is the one that shows what you have learned.<\/span>\n      <\/button>\n    <\/div>\n\n    <div class=\"write-bar\">\n      <span class=\"note\" id=\"writeWord\"><\/span>\n      <button class=\"btn primary\" id=\"checkDone\" type=\"button\" hidden>Score my writing<\/button>\n      <\!-- FW-THEMES:BEGIN -->\n      <label class=\"skin-pick\">\n        <span class=\"sw\" aria-hidden=\"true\"><\/span>\n        <select id=\"skinSel\" aria-label=\"Writing surface\">\n          <option value=\"\">Plain paper<\/option>\n        <option value=\"classroom\">Classroom<\/option>\n        <option value=\"space\">Space station<\/option>\n        <option value=\"treehouse\">Treehouse<\/option>\n        <option value=\"submarine\">Submarine<\/option>\n        <option value=\"study\">Wizard study<\/option>\n        <option value=\"studio\">Art studio<\/option>\n        <option value=\"campfire\">Night camp<\/option>\n        <\/select>\n      <\/label>\n      <\!-- FW-THEMES:END -->\n      <button class=\"btn\" id=\"clearBtn\" type=\"button\">Clear<\/button>\n    <\/div>\n\n    <div id=\"stageSlotW\">\n      <section class=\"stage\" id=\"stage\">\n        <canvas id=\"pad\" aria-label=\"Tracing area. Draw with a finger, stylus or mouse.\"><\/canvas>\n        <div class=\"hud\">\n          <span class=\"pill\" id=\"hudLeft\">Sample attempt<\/span>\n          <span class=\"pill\" id=\"hudPen\"><span class=\"dot\"><\/span><span id=\"hudPenTxt\">Pen up<\/span><\/span>\n        <\/div>\n        <div class=\"pager\" id=\"pager\" hidden>\n          <button type=\"button\" class=\"pg-btn\" id=\"pgPrev\" aria-label=\"Previous page\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M10 3L5 8l5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n          <div class=\"pg-mid\" aria-live=\"polite\"><span id=\"pageTxt\">Page 1 of 1<\/span><span class=\"pg-dots\" id=\"pgDots\" aria-hidden=\"true\"><\/span><\/div>\n          <button type=\"button\" class=\"pg-btn\" id=\"pgNext\" aria-label=\"Next page\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M6 3l5 5-5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n        <\/div>\n      <\/section>\n    <\/div>\n\n    <div class=\"wave-wrap\" id=\"waveWWrap\" hidden>\n      <div class=\"wave-head\"><span class=\"metro-light\" aria-hidden=\"true\"><\/span><span id=\"waveWName\"><\/span><\/div>\n      <canvas id=\"waveW\" aria-label=\"Waveform of your track with the beat grid\"><\/canvas>\n    <\/div>\n\n    <div id=\"mapSlotW\">\n      <section class=\"beatmap\" id=\"beatmap\">\n        <div class=\"beatmap-head\">\n          <h2>Beat map<\/h2>\n          <p id=\"beatmapNote\">4-beat count-in, then one stroke per beat. Tap a stroke to inspect it.<\/p>\n        <\/div>\n        <div class=\"lane-scroll\"><div class=\"lane\" id=\"lane\"><\/div><\/div>\n      <\/section>\n    <\/div>\n\n    <div class=\"foot-actions\">\n      <button class=\"btn\" type=\"button\" data-go=\"setup\">Back to setup<\/button>\n      <button class=\"btn\" type=\"button\" data-go=\"results\">See results<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/button>\n    <\/div>\n  <\/section>\n\n  <\!-- ================= 3. RESULTS ================= -->\n  <section class=\"view\" id=\"view-results\" hidden>\n    <div class=\"view-head\">\n      <div><h1>Results<\/h1><p class=\"run\" id=\"runInfo\"><\/p><\/div>\n      <div class=\"foot-actions\">\n        <button class=\"btn\" type=\"button\" data-go=\"setup\">Change setup<\/button>\n        <button class=\"btn primary\" type=\"button\" data-go=\"write\">Try again<\/button>\n      <\/div>\n    <\/div>\n\n    <div c n/N*100)+'%'; i.style.background=c; m.appendChild(i);} });\n  $('legend').innerHTML=[[valid,'ok','valid'],[off,'bad','outside margin'],[missed,'missed','missed']]\n    .map(([n,c,l])=>`<span><i style=\"background:var(--${c})\"><\/i>${n} ${l}<\/span>`).join('')+(pending&&!S.playing?`<span>${pending} not traced<\/span>`:'');\n\n  // what this attempt was\n  const r=S.lastRun; let run;\n  if(S.sample) run='Sample attempt. Watch the demo, then try Practice or Test to see your own results.';\n  else if(r&&r.mode==='check') run=`On your own · no music, no beat · scored on shape only · margin ${Math.round(S.tol*100)}%`;\n  else if(r) run=`${MODE_NAME[r.mode]} · ${r.mode==='practice'?(r.gate==='duck'?'music thinned out when your pen left the path':r.gate==='off'?'music kept going, no help':'music followed your pen'):r.mode==='test'?'you followed the music':'model pen'} · ${fmtBpm(r.bpm)} BPM · ${S.bps} beat${S.bps>1?'s':''} per stroke · margin ${Math.round(S.tol*100)}%`+(r.mode==='practice'&&r.gate==='hold'?` · music paused ${r.pauses}×`:'');\n  else run=S.points.length?'Free trace (not timed).':'No attempt yet.';\n  $('runInfo').textContent=run;\n\n  // averages over strokes that got ink\n  const tr=scored.filter(s=>s.res.status!=='missed');\n  const avg=f=>tr.length?tr.reduce((a,s)=>a+s.res[f],0)/tr.length:null;\n  const am=(v,rule,name)=>`<div class=\"metric\"><span class=\"n ${v==null?'':v>=rule?'pass':'fail'}\">${v==null?'–':pct(v)}<\/span><span class=\"k\">${name}<\/span><span class=\"t\">average · needs ≥ ${pct(rule)}<\/span><\/div>`;\n  $('avgs').innerHTML=am(avg('inside'),RULES.inside,'of ink inside margin')+am(avg('cover'),RULES.cover,'of stroke covered')+(timed?am(avg('onTime'),RULES.onTime,'of ink on the beat'):'');\n\n  // why strokes did not count (a stroke can fail for more than one reason)\n  const offS=scored.filter(s=>s.res.status==='off');\n  const iss=[['Strayed outside the margin',offS.filter(s=>s.res.inside<RULES.inside).length],\n             ['Skipped part of the stroke',offS.filter(s=>s.res.cover<RULES.cover).length],\n             ...(timed?[['Drawn off the beat',offS.filter(s=>s.res.onTime<RULES.onTime).length]]:[]),\n             ['Missed completely',missed]];\n  const mx=Math.max(1,...iss.map(i=>i[1]));\n  $('issues').innerHTML=iss.map(([l,n])=>`<div class=\"issue\"><span>${l}<\/span><span class=\"trk\"><i style=\"width:${n/mx*100}%\"><\/i><\/span><b>${n}<\/b><\/div>`).join('');\n\n  // letters with strokes that did not count\n  const by=new Map();\n  S.strokes.forEach((s,k)=>{ let e=by.get(s.li); if(!e){ e={li:s.li,ch:s.ch,word:s.word,n:0,bad:0,k:-1}; by.set(s.li,e); }\n    e.n++; if(s.res&&s.res.status!=='valid'){ e.bad++; if(e.k<0) e.k=k; } });\n  const selLi=S.strokes[S.selected]?S.strokes[S.selected].li:-1;\n  const list=[...by.values()].filter(e=>e.bad).sort((a,b)=>b.bad/b.n-a.bad/a.n||a.li-b.li).slice(0,14);\n  $('letters').innerHTML=list.length\n    ?list.map(e=>`<button type=\"button\" class=\"lt${e.li===selLi?' sel':''}\" data-k=\"${e.k}\" title=\"In “${esc(e.word)}”\"><span class=\"ch\">${esc(e.ch)}<\/span><span class=\"ix\">${e.bad}/${e.n} off<\/span><\/button>`).join('')\n    :`<p class=\"note\">${scored.length?'Every letter counted. Nice work.':'Nothing scored yet.'}<\/p>`;\n\n  // single stroke inspector\n  const box=$('insp'); const k=S.playing?S.active:S.selected;\n  if(k==null||k<0||k>=N){ box.innerHTML=`<p class=\"note\">${S.playing?'Get ready. The first stroke starts on the downbeat after the count-in.':'Tap a stroke in the beat map to see how it was scored.'}<\/p>`; return; }\n  const s=S.strokes[k], rs=s.res, st=rs?rs.status:'pending';\n  const label={valid:'Valid trace',off:'Outside margin',missed:'Missed',pending:S.playing?'In progress':'Not traced'}[st];\n  const [a,b]=windowOf(k);\n  const metric=(v,rule,name)=>`<div class=\"metric\"><span class=\"n ${rs&&rs.status!=='missed'?(v>=rule?'pass':'fail'):''}\">${rs?pct(v):'–'}<\/span><span class=\"k\">${name}<\/span><span class=\"t\">needs ≥ ${pct(rule)}<\/span><\/div>`;\n  let why='';\n  if(rs&&rs.status==='off'){\n    const fails=[]; if(rs.inside<RULES.inside) fails.push('too much ink strayed outside the margin'); if(rs.cover<RULES.cover) fails.push('part of the stroke was skipped'); if(timed&&rs.onTime<RULES.onTime) fails.push('the stroke was drawn off the beat');\n    why=`<p class=\"note\">Not counted: ${fails.join(', ')}.<\/p>`;\n  } else if(rs&&rs.status==='missed') why=`<p class=\"note\">${timed?'No ink landed in this stroke’s beat window.':'No ink landed on this stroke.'}<\/p>`;\n  else if(rs) why=`<p class=\"note\">Counted. The ink stayed inside the margin${timed?', covered the stroke, and arrived on its beat':' and covered the stroke'}.<\/p>`;\n  box.innerHTML=`<div class=\"insp-title\"><span class=\"glyph\">${s.ch}<\/span><div><h2>Stroke ${s.si+1} of ${s.of}: ${s.name}<\/h2><span class=\"note\">${timed?`Beats ${a-COUNT_IN+1}${S.bps>1?'–'+(b-COUNT_IN):''} · `:''}${rs?rs.n+' ink points':'no ink yet'}<\/span><\/div><span class=\"status ${st}\">${label}<\/span><\/div>\n    <div class=\"metrics\">${metric(rs?rs.inside:0,RULES.inside,'of ink inside margin')}${metric(rs?rs.cover:0,RULES.cover,'of stroke covered')}${timed?metric(rs?rs.onTime:0,RULES.onTime,'of ink on the beat'):''}<\/div>${why}`;\n}\n$('letters').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(b) selectStroke(+b.dataset.k); });\nfunction updateSummary(){\n  const txt=`<b>${esc(shortText(S.word))}<\/b> · ${S.strokes.length} strokes · ${S.pages} page${S.pages>1?'s':''} · ${fmtBpm(S.bpm)} BPM`;\n  $('setupSummary').innerHTML=txt; $('writeWord').innerHTML=txt;\n}\nfunction updateModes(){\n  const map={demo:$('demoBtn'),practice:$('pracBtn'),test:$('testBtn'),check:$('checkBtn')};\n  Object.entries(map).forEach(([m,b])=>{ b.disabled=S.playing||S.checking; b.classList.toggle('running',(S.playing&&S.mode===m)||(m==='check'&&S.checking)); b.classList.remove('primary'); });\n  if(!S.demoWatched) map.demo.classLi   });

// ---------- validation rules ----------
const RULES = {
  password: p => p.length >= 8 && !/\s/.test(p),

// ---------- derived stats ----------
function userAttempts(uid_, from = 0){ return DB.attempts.filter(a => a.userId === uid_ && a.date >= from); }
function acc(a){ return a.total ? a.valid / a.total : 0; }
function statsFor(uid_, from = 0){
  const at = userAttempts(uid_);

  const learned = new Map(); // word -> {count, first}

}
function lessonPassed(uid_, lessonId){ return DB.attempts.some(a => a.userId === uid_ && a.lessonId === lessonId && a.mode === 'test' && acc(a) >= .9); }
function lessonBest(uid_, lessonId){ let b = null; DB.attempts.forEach(a => { if (a.userId === uid_ && a.lessonId === lessonId && a.mode === 'test') b = Math.max(b ?? 0, acc(a)); }); return b; }
function moduleState(uid_){
  let open = true;
  return CURRICULUM.map(m => {
    const passed = m.lessons.filter(l => lessonPassed(uid_, l.id)).length;
    const st = { module: m, unlocked: open, passed, total: m.lessons.length, done: passed === m.lessons.length };
    open = open && st.done;

}
function assignmentsFor(user){
  if (!user.classId) return [];
  return DB.assignments.filter(a => a.classId === user.classId && (!a.studentIds || a.studentIds.includes(user.id))).sort((a, b) => a.due - b.due);
}
function submission(uid_, aid){ const s = DB.attempts.filter(a => a.userId === uid_ && a.assignmentId === aid); return s.length ? s.reduce((b, a) => acc(a) > acc(b) ? a : b) : null; }

function leaderboard(scope, user, metric){
  let pool = DB.users.filter(u => u.role !== 'teacher');
  if (scope === 'class') pool = pool.filter(u => u.classId && u.classId === user.classId);
  else if (scope === 'school') pool = pool.filter(u => u.role === 'student' && u.school === user.school);
  else if (scope === 'global') pool = pool.filter(u => u.role === 'general');
  else if (scope.startsWith('c_')) pool = pool.filter(u => u.classId === scope);
  const rows = pool.map(u => { const s = statsFor(u.id); return { u, s }; });
  if (metric === 'time') return { ranked: rows.sort((a, b) => b.s.seconds - a.s.seconds).map(r => ({ ...r, value: r.s.seconds })), unranked: 0 };
  if (metric === 'words') return { ranked: rows.sort((a, b) => b.s.wordsSeen - a.s.wordsSeen).map(r => ({ ...r, value: r.s.wordsSeen })), unranked: 0 };
  const q = rows.filter(r => r.s.best);
  return { ranked: q.sort((a, b) => b.s.best.bpm - a.s.best.bpm || a.s.best.date - b.s.best.date).map(r => ({ ...r, value: r.s.best.bpm })), unranked: rows.length - q.length };
}

// ---------- api ----------
const delay = (v, ms = 120) => new Promise(r => setTimeout(() => r(v), ms));
const fail = msg => Promise.reject(new Error(msg));
const api = {
  login(id, password){
    const u = DB.users.find(u => u.username.toLowerCase() === id.toLowerCase() || u.email.toLowerCase() === id.toLowerCase());
    if (!u) return fail('No account with that username or email.');
    if (u.password !== password) return fail('That password doesn’t match this account.');
    return delay(u);
  },
  signup(f){
    if (!RULES.email(f.email)) return fail('Enter a valid email address.');
    const username = f.username || f.email;
    if (!RULES.username(username)) return fail('Usernames need at least 3 characters and no spaces.');
    if (!RULES.password(f.password)) return fail('Passwords need at least 8 characters and no spaces.');
    if (DB.users.some(u => u.username.toLowerCase() === username.toLowerCase())) return fail('That username is taken.');
    if (DB.users.some(u => u.email.toLowerCase() === f.email.toLowerCase())) return fail('An account already uses that email.');
    let classId = null, school = null;
    if (f.role === 'student'){
      if (!f.birth) return fail('Students need a birth date.');
      const c = DB.classes.find(c => c.code === (f.code || '').trim().toUpperCase() && !c.archived);
      if (!c) return fail('That class code doesn’t match an open class. Ask your teacher for the 6-letter code.');
      classId = c.id; school = c.school;
    }
    const u = { id: uid('u_'), username, email: f.email, password: f.password, role: f.role, name: f.name || username, birth: f.birth || null, classId, school: f.role === 'teacher' ? (f.school || 'My school') : school, joined: Date.now(), prog: 0 };
    DB.users.push(u); saveDB(); return delay(u);
  },
  requestReset(email){
    const u = DB.users.find(u => u.email.toLowerCase() === email.toLowerCase());
    const token = uid('r');
    if (u) { DB.resets.push({ token, userId: u.id, exp: Date.now() + DAY }); saveDB(); }
    return delay({ token: u ? token : null, email }); // real backend would email the link; demo returns it
  },
  resetPassword(token, pw){
    const r = DB.resets.find(r => r.token === token && r.exp > Date.now());
    if (!r) return fail('This reset link has expired. Request a new one.');
    if (!RULES.password(pw)) return fail('Passwords need at least 8 characters and no spaces.');
    DB.users.find(u => u.id === r.userId).password = pw; DB.resets = DB.resets.filter(x => x !== r); saveDB(); return delay(true);
  },
  recordAttempt(a){ const rec = { id: uid('t_'), date: Date.now(), ...a }; DB.attempts.push(rec); saveDB(); return rec; },
  addActivity(userId, seconds){ const last = [...DB.attempts].reverse().find(a => a.userId === userId && Date.now() - a.date < 36e5); if (last) { last.seconds = (last.seconds || 0) + seconds; saveDB(); } },
  saveAssignment(a){ if (a.id){ const i = DB.assignments.findIndex(x => x.id === a.id); DB.assignments[i] = { ...DB.assignments[i], ...a }; } else DB.assignments.push({ ...a, id: uid('a_'), created: Date.now() }); saveDB(); },
  deleteAssignment(id){ DB.assignments = DB.assignments.filter(a => a.id !== id); saveDB(); },
  extendAssignment(id, days){ const a = DB.assignments.find(a => a.id === id); a.due = Math.max(a.due, Date.now()) + days * DAY; saveDB(); },
  addClass(teacher, name){ const c = { id: uid('c_'), teacherId: teacher.id, name, code: newCode(), school: teacher.school, archived: false, created: Date.now() }; DB.classes.push(c); saveDB(); return c; },
  regenCode(cid){ const c = DB.classes.find(c => c.id === cid); c.code = newCode(); saveDB(); return c.code; },
  archiveClass(cid, on){ DB.classes.find(c => c.id === cid).archived = on; saveDB(); },
  removeStudent(uid_){ const u = DB.users.find(u => u.id === uid_); u.classId = null; saveDB(); },
  addSong(s){ DB.songs.push(s); saveDB(); return s; },
  resetDemo(){ try { localStorage.removeItem(STORE_KEY); } catch (e) {} DB = seedDB(); },
  async fetchExcerpt(i){
    // Live source: Project Gutenberg through the Gutendex API. Falls back to the bundled copy.
    const e = EXCERPTS[i % EXCERPTS.length];
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
      const res = await fetch('https://gutendex.com/books/' + e.gid, { signal: ctl.signal }); clearTimeout(t);

  },
};

    [1, 2, .5, 1.5, 2 / 3].forEach(f => { const c = bpm0 * f; if (c < 50 || c > 210) return; for (let b = c - 1.5; b <= c + 1.5; b += .25){ const v = comb(env, 60 * fps / b) * prior(b); if (v > pickv){ pickv = v; pickb = b; } } });
    let bpm = Math.round(pickb * 10) / 10; if (Math.abs(bpm - Math.round(bpm)) < .3) bpm = Math.round(bpm);
    return { bpm, from: 'audio', duration: buf.duration };
  }
  return { starterFile, preview, stopPreview, detectBpm, playing: () => liveId };
})();

// =====================================================================
// FloWriter backend adapter (Supabase)
//
// Loads only when a config is present (see config.example.js). Without one
// the app keeps running exactly as before, on the seeded demo DB in
// localStorage, so the demo still works offline.
//
// How it works: on boot it pulls the rows this account is allowed to see
// into the same in-memory `DB` the views already read synchronously, then
// mirrors every write back to Postgres in the background. That keeps the
// existing synchronous view code unchanged. It means a classroom sees each
// other's updates on refresh rather than instantly, which is the right
// trade for a pilot and the wrong one for a live product at scale.
// =====================================================================
const Backend = (() => {
  const CFG = (typeof window !== 'undefined' && window.FLOWRITER_CONFIG) || null;
  const enabled = !!(CFG && CFG.url && CFG.anonKey);
  let sb = null, failed = 0;

  const camel = r => r && { ...r, classId: r.class_id, teacherId: r.teacher_id, userId: r.user_id,
    assignmentId: r.assignment_id, lessonId: r.lesson_id, studentIds: r.student_ids, ownerId: r.owner_id,
    birth: r.birth_year ? String(r.birth_year) : null,
    due: r.due ? new Date(r.due).getTime() : undefined,
    created: r.created ? new Date(r.created).getTime() : undefined,
    joined: r.joined ? new Date(r.joined).getTime() : undefined,
    date: r.created ? new Date(r.created).getTime() : undefined };

  const snakeAttempt = a => ({ id: a.id, user_id: a.userId, source: a.source, assignment_id: a.assignmentId || null,
    lesson_id: a.lessonId || null, module: a.module || null, mode: a.mode, gate: a.gate || null,
    text: a.text, valid: a.valid, total: a.total, bpm: a.bpm ?? null, seconds: a.seconds || 0 });
  const snakeAssignment = a => ({ id: a.id, class_id: a.classId, title: a.title, module: a.module || null,
    lesson_id: a.lessonId || null, kind: a.kind, text: a.text, due: new Date(a.due).toISOString(),
    song_id: a.songId || null, bpm: a.bpm ?? null, difficulty: a.difficulty || 'standard',
    student_ids: a.studentIds && a.studentIds.length ? a.studentIds : null });

  function warn(e, what){
    failed++;
    console.error('[flowriter] ' + what, e);
    if (failed <= 2 && typeof toast === 'function') toast(`Could not save ${what} to the server. It is saved on this device.`, 5000);
  }
  // fire-and-forget write; the local copy is already updated
  const push = (p, what) => Promise.resolve(p).then(r => { if (r && r.error) warn(r.error, what); }, e => warn(e, what));

  async function connect(){
    if (sb) return sb;
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    sb = createClient(CFG.url, CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    return sb;
  }

  // ---------- pull everything this account may see into the in-memory DB ----------
  async function hydrate(profile){
    const [profiles, classes, assignments, attempts, songs] = await Promise.all([
      sb.from('profiles').select('*'),
      sb.from('classes').select('*'),
      sb.from('assignments').select('*'),
      sb.from('attempts').select('*').order('created', { ascending: true }),
      sb.from('songs').select('*'),
    ]);
    const err = [profiles, classes, assignments, attempts, songs].find(r => r.error);
    if (err) throw err.error;
    DB = {
      v: 3,
      users: profiles.data.map(camel),
      classes: classes.data.map(camel),
      assignments: assignments.data.map(camel),
      attempts: attempts.data.map(camel),
      // the six built-in songs are generated in the browser, so they are always available
      songs: [...STARTER_SONGS.map(s => ({ ...s, kind: 'starter' })), ...songs.data.map(camel).filter(s => s.kind === 'upload')],
      resets: [],
    };
    return DB.users.find(u => u.id === profile.id) || camel(profile);
  }

  async function profileFor(userId){
    const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
    if (error) throw error;
    return data;
  }

  // ---------- the api surface the app already calls ----------
  function install(){
    api.login = async (id, password) => {
      let email = id.trim();
      if (!email.includes('@')) { // allow username login: look up the email behind it
        const { data } = await sb.rpc('email_for_username', { u: email });
        if (!data) throw new Error('No account with that username or email.');
        email = data;
      }
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(/Invalid/.test(error.message) ? 'That password doesn’t match this account.' : error.message);
      const p = await profileFor(data.user.id);
      const u = await hydrate(p);
      return u;
    };

    api.signup = async f => {
      const username = (f.username || f.email).trim();
      if (!RULES.email(f.email)) throw new Error('Enter a valid email address.');
      if (!RULES.username(username)) throw new Error('Usernames need at least 3 characters and no spaces.');
      if (!RULES.password(f.password)) throw new Error('Passwords need at least 8 characters and no spaces.');
      let classId = null, school = f.role === 'teacher' ? (f.school || 'My school') : null;
      if (f.role === 'student') {
        if (!f.birth) throw new Error('Students need a birth date.');
        const { data: cid } = await sb.rpc('class_id_for_code', { c: (f.code || '').trim() });
        if (!cid) throw new Error('That class code doesn’t match an open class. Ask your teacher for the 6-letter code.');
        classId = cid;
        const { data: cls } = await sb.from('classes').select('school').eq('id', cid).single();
        school = cls ? cls.school : null;
      }
      const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.password });
      if (error) throw new Error(/already/i.test(error.message) ? 'An account already uses that email.' : error.message);
      if (!data.user) throw new Error('Check your email to confirm the account, then log in.');
      // only the birth YEAR is stored, never the full date
      const row = { id: data.user.id, username, role: f.role, name: f.name || username,
        birth_year: f.birth ? +String(f.birth).slice(0, 4) : null, class_id: classId, school, prog: 0 };
      const { error: pe } = await sb.from('profiles').insert(row);
      if (pe) throw new Error(/duplicate/i.test(pe.message) ? 'That username is taken.' : pe.message);
      return await hydrate(row);
    };

    api.requestReset = async email => {
      const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname + '#/reset' });
      if (error) throw new Error(error.message);
      return { token: null, email }; // the real email carries the link; nothing to show in-app
    };
    api.resetPassword = async (_token, pw) => {
      if (!RULES.password(pw)) throw new Error('Passwords need at least 8 characters and no spaces.');
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) throw new Error(error.message);
      return true;
    };
    api.logout = () => sb.auth.signOut();

    // ---- writes: update the local copy first so the UI stays synchronous ----
    api.recordAttempt = a => {
      const rec = { id: crypto.randomUUID(), date: Date.now(), ...a };
      DB.attempts.push(rec);
      push(sb.from('attempts').insert(snakeAttempt(rec)), 'this attempt');
      return rec;
    };
    api.addActivity = (userId, seconds) => {
      const last = [...DB.attempts].reverse().find(a => a.userId === userId && Date.now() - a.date < 36e5);
      if (!last) return;
      last.seconds = (last.seconds || 0) + seconds;
      push(sb.from('attempts').update({ seconds: last.seconds }).eq('id', last.id), 'practice time');
    };
    api.saveAssignment = a => {
      if (a.id) { const i = DB.assignments.findIndex(x => x.id === a.id); DB.assignments[i] = { ...DB.assignments[i], ...a }; }
      else { a = { ...a, id: crypto.randomUUID(), created: Date.now() }; DB.assignments.push(a); }
      push(sb.from('assignments').upsert(snakeAssignment(a)), 'this assignment');
    };
    api.deleteAssignment = id => {
      DB.assignments = DB.assignments.filter(a => a.id !== id);
      push(sb.from('assignments').delete().eq('id', id), 'that deletion');
    };
    api.extendAssignment = (id, days) => {
      const a = DB.assignments.find(a => a.id === id);
      a.due = Math.max(a.due, Date.now()) + days * DAY;
      push(sb.from('assignments').update({ due: new Date(a.due).toISOString() }).eq('id', id), 'the new due date');
    };
    api.addClass = (teacher, name) => {
      const c = { id: crypto.randomUUID(), teacherId: teacher.id, name, code: newCode(), school: teacher.school, archived: false, created: Date.now() };
      DB.classes.push(c);
      push(sb.from('classes').insert({ id: c.id, teacher_id: c.teacherId, name: c.name, code: c.code, school: c.school }), 'the new class');
      return c;
    };
    api.regenCode = cid => {
      const c = DB.classes.find(c => c.id === cid); c.code = newCode();
      push(sb.from('classes').update({ code: c.code }).eq('id', cid), 'the new class code');
      return c.code;
    };
    api.archiveClass = (cid, on) => {
      DB.classes.find(c => c.id === cid).archived = on;
      push(sb.from('classes').update({ archived: on }).eq('id', cid), 'that change');
    };
    api.removeStudent = uid_ => {
      const u = DB.users.find(u => u.id === uid_); u.classId = null;
      push(sb.from('profiles').update({ class_id: null }).eq('id', uid_), 'that change');
    };
    api.addSong = s => {
      DB.songs.push(s);
      push(sb.from('songs').insert({ id: s.id, owner_id: s.ownerId || null, title: s.title, artist: s.artist || null,
        bpm: s.bpm, style: s.style || null, mood: s.mood || null, hue: s.hue ?? null, kind: 'upload' }), 'that song');
      return s;
    };
    api.resetDemo = () => { if (typeof toast === 'function') toast('This build is connected to a real database, so there is no demo data to reset.'); };
    api.refresh = async () => { const u = state.user; if (u) await hydrate({ id: u.id }); };
  }

  // ---------- boot ----------
  async function boot(){
    await connect();
    install();
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      try {
        const p = await profileFor(data.session.user.id);
        state.user = await hydrate(p);
      } catch (e) { console.error('[flowriter] session restore', e); await sb.auth.signOut(); }
    }
  }

  return { enabled, boot, client: () => sb };
})();

async function submitForm(name, form){
  const f = Object.fromEntries(new FormData(form)); const err = form.querySelector('.form-error'); err.textContent = '';
  $$('.input', form).forEach(i => i.removeAttribute('aria-invalid'));
  const bad = (msg, field) => { err.textContent = msg; if (field) { const i = form.querySelector(`[name="${field}"]`); i && (i.setAttribute('aria-invalid', 'true'), i.focus()); } };
  try {
    if (name === 'login') {
      if (!f.id || !f.password) return bad('Enter your username or email and your password.', !f.id ? 'id' : 'password');
      const u = await api.login(f.id.trim(), f.password); setSession(u, !!f.remember); go(u.role === 'teacher' ? 'teach' : 'home');
    } else if (name === 'signup') {
      if (!RULES.email(f.email || '')) return bad('Enter a valid email address.', 'email');
      if (f.username && /\s/.test(f.username)) return bad('Usernames can’t contain spaces.', 'username');
      if (!RULES.password(f.password || '')) return bad('Passwords need at least 8 characters and no spaces.', 'password');
      if (f.password !== f.password2) return bad('The two passwords don’t match.', 'password2');
      if (f.role === 'student' && !f.birth) return bad('Add your birth date.', 'birth');
      if (f.role === 'student' && !(f.code || '').trim()) return bad('Add the class code from your teacher.', 'code');
      const u = await api.signup({ ...f, username: (f.username || '').trim() }); setSession(u, !!f.remember);
      if (u.role === 'teacher') { api.addClass(u, 'Period 1'); go('teach'); } else go('home');
      toast(`<span class="big">Welcome!</span> Account created for ${esc(u.username)}`);
    } else if (name === 'forgot') {
      if (!RULES.email(f.email || '')) return bad('Enter the email on your account.', 'email');
      const r = await api.requestReset(f.email.trim()); go(`forgot?sent=1&email=${encodeURIComponent(r.email)}${r.token ? '&token=' + r.token : ''}`);
    } else if (name === 'reset') {
      if (!RULES.password(f.password || '')) return bad('Passwords need at least 8 characters and no spaces.', 'password');
      if (f.password !== f.password2) return bad('The two passwords don’t match.', 'password2');
      await api.resetPassword(f.token, f.password); toast('Password saved. Log in with the new one.'); go('login');
    }
  } catch (e) { const m = e.message || 'Something went wrong.'; bad(m, /code/i.test(m) ? 'code' : /password/i.test(m) ? 'password' : /user/i.test(m) ? (name === 'login' ? 'id' : 'username') : /email/i.test(m) ? 'email' : null); }
}

const RANGES = { '1m': { label: '1 month', days: 30, step: 'day' }, '6m': { label: '6 months', days: 182, step: 'week' }, '1y': { label: '1 year', days: 365, step: 'week' }, all: { label: 'All time', days: null, step: 'month' } };
function buckets(rangeKey, joined){
  const r = RANGES[rangeKey], now = Date.now(), start = r.days ? now - r.days * DAY : joined, out = [];
  if (r.step === 'month') { const d = new Date(start); d.setDate(1); d.setHours(0, 0, 0, 0); while (d.getTime() <= now) { const a = d.getTime(); d.setMonth(d.getMonth() + 1); out.push({ a, b: Math.min(d.getTime(), now + 1), label: new Date(a).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) }); } }
  else { const step = r.step === 'day' ? DAY : 7 * DAY; const d0 = new Date(start); d0.setHours(0, 0, 0, 0); for (let a = d0.getTime(); a <= now; a += step) out.push({ a, b: a + step, label: fmtShort(a) }); }
  return out;
}

// ---------- charts ----------
const CHARTS = {};
CHARTS.words = () => {
  const u = state.user, s = statsFor(u.id), bk = buckets(state.stats.range, u.joined), firsts = [...s.learned.values()].map(e => e.first);
  return { kind: 'line', labels: bk.map(b => b.label), values: bk.map(b => firsts.filter(f => f < b.b).length), dates: bk.map(b => Math.min(b.b - 1, Date.now())), unit: v => `${v} words` };
};
CHARTS.activity = () => {
  const u = state.user, at = userAttempts(u.id), bk = buckets(state.stats.range, u.joined);
  return { kind: 'bar', labels: bk.map(b => b.label), values: bk.map(b => Math.round(at.filter(a => a.date >= b.a && a.date < b.b).reduce((t, a) => t + (a.seconds || 0), 0) / 60)), dates: bk.map(b => b.a), unit: v => `${v} min`, step: RANGES[state.stats.range].step };
};
function niceMax(v){ const raw = Math.max(1, v / 4), p = Math.pow(10, Math.floor(Math.log10(raw))); for (const m of [1, 2, 5, 10]) if (m * p >= raw) return m * p * 4; return 40 * p; }
function drawChart(el){
  const spec = CHARTS[el.dataset.chart](), W = Math.max(280, el.clientWidth), H = 230, L = 42, R = 12, T = 12, B = 30;
  const n = spec.values.length, max = niceMax(Math.max(...spec.values, 1)), iw = W - L - R, ih = H - T - B;
  const x = i => spec.kind === 'bar' ? L + (i + .5) * iw / n : L + (n > 1 ? i * iw / (n - 1) : iw / 2), y = v => T + ih - v / max * ih;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const every = Math.ceil(n / Math.max(2, Math.floor(iw / 70)));
  let marks = '';
  if (spec.kind === 'line') {
    const pts = spec.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    marks = `<path class="area" d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(n - 1)},${y(0)} Z"/><path class="lineP" d="M${pts.join(' L')}"/><circle class="dot" cx="${x(n - 1)}" cy="${y(spec.values[n - 1])}" r="4.5"/>`;
  } else {
    const bw = Math.max(2, iw / n - 2);
    marks = spec.values.map((v, i) => { const h = Math.max(v ? 2 : 0, v / max * ih); return h ? `<path class="barP" data-i="${i}" d="M${x(i) - bw / 2},${y(0)} v${-(h - Math.min(4, bw / 2, h))} q0,${-Math.min(4, bw / 2, h)} ${Math.min(4, bw / 2)},${-Math.min(4, bw / 2, h)} h${bw - 2 * Math.min(4, bw / 2)} q${Math.min(4, bw / 2)},0 ${Math.min(4, bw / 2)},${Math.min(4, bw / 2, h)} V${y(0)} Z"/>` : ''; }).join('');
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${el.dataset.chart === 'words' ? 'Words learned, cumulative' : 'Active minutes'} over ${RANGES[state.stats.range].label}">
    <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`).join('')}
      ${spec.labels.map((l, i) => i % every === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>` : '').join('')}</g>
    ${marks}<line class="cross" x1="0" x2="0" y1="${T}" y2="${T + ih}" style="display:none"/><circle class="dot hov" r="5" style="display:none"/>
    <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), cross = el.querySelector('.cross'), hov = el.querySelector('.hov');
  const show = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let i = spec.kind === 'bar' ? Math.floor((px - L) / (iw / n)) : Math.round((px - L) / (iw / Math.max(1, n - 1))); i = Math.max(0, Math.min(n - 1, i));
    const v = spec.values[i], d = spec.dates[i];
    const when = spec.kind === 'bar' ? (spec.step === 'day' ? fmtDate(d) : spec.step === 'week' ? 'Week of ' + fmtShort(d) : new Date(d).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })) : fmtDate(d);
    tip.hidden = false; tip.innerHTML = `${when}<br><b>${spec.unit(v)}</b>`; tip.style.left = (x(i) * r.width / W) + 'px'; tip.style.top = (y(v) * r.height / H) + 'px';
    if (spec.kind === 'line') { cross.style.display = ''; cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); hov.style.display = ''; hov.setAttribute('cx', x(i)); hov.setAttribute('cy', y(v)); }
    else $$('.barP', svg).forEach(b => b.classList.toggle('hi', +b.dataset.i === i));
  };
  const hide = () => { tip.hidden = true; cross.style.display = 'none'; hov.style.display = 'none'; $$('.barP', svg).forEach(b => b.classList.remove('hi')); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerleave', hide);
}
function mountCharts(){
  const els = $$('[data-chart]'); if (!els.length) return;
  els.forEach(drawChart);
  const ro = new ResizeObserver(() => els.forEach(e => { if (Math.abs((e._w || 0) - e.clientWidth) > 4) { e._w = e.clientWidth; drawChart(e); } }));
  els.forEach(e => { e._w = e.clientWidth; ro.observe(e); }); cleanup.push(() => ro.disconnect());
}

  const classes = myClasses(), cid = q.get('c') || state.teach.classId || classes[0].id, cls = classes.find(c => c.id === cid);
  return `<div class="page-head"><div><p class="eyebrow">Class rankings</p><h1>${esc(cls.name)}</h1><p class="note">Three leaderboards. The speed board ranks only students with 90%+ accuracy on their best-BPM song; ties go to whoever got there first.</p></div>
    <select class="input" style="width:auto" data-act="rank-class" aria-label="Class period">${classes.map(c => `<option value="${c.id}" ${c.id === cid ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div class="boards">${boardPanel(cid, null, 'time')}${boardPanel(cid, null, 'words')}${boardPanel(cid, null, 'bpm')}</div>`;
}

// ---------- uploads (MP3 only, BPM auto-detected) ----------
async function handleUpload(input){
  const file = input.files[0]; input.value = ''; if (!file) return;
  const note = input.dataset.upload === 'free' ? $('#fpUpNote') : $('#asUpNote');
  if (!/\.mp3$/i.test(file.name) && file.type !== 'audio/mpeg') { note.textContent = `“${file.name}” isn’t an MP3. Only MP3 files can be added.`; note.style.color = 'var(--bad)'; return; }
  note.style.color = ''; note.textContent = `Listening for the beat in ${file.name}…`;
  try {
    const r = await Music.detectBpm(file);
    const s = api.addSong({ id: uid('sg_'), title: file.name.replace(/\.mp3$/i, '').replace(/[_-]+/g, ' ').slice(0, 40), artist: state.user.username, bpm: Math.round(r.bpm), style: 'Your upload', mood: 'bright', kind: 'upload', ownerId: state.user.id, hue: Math.floor(Math.random() * 360) });
    RUNTIME.songFiles[s.id] = file;
    if (input.dataset.upload === 'free') { state.play.songId = s.id; rerender(); toast(`Added “${esc(s.title)}” · ${s.bpm} BPM ${r.from === 'name' ? 'from the file name' : 'detected'}`); }
    else { $('#asSongs').insertAdjacentHTML('beforeend', songRow(s, false, 'as-song')); pickAsSong(s.id); $('#asUpNote').textContent = `Added · ${s.bpm} BPM detected`; }
  } catch (e) { note.textContent = 'That file couldn’t be read as audio.'; note.style.color = 'var(--bad)'; }
}
function pickAsSong(id){ $('input[name="songId"]').value = id; $$('#asSongs .song').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.id === id))); }

// =====================================================================
// EVENTS
// =====================================================================
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (act === 'close-overlay') { if (e.target === t || t.tagName === 'BUTTON') closeOverlay(); return; }
  switch (act) {
    case 'theme': { const n = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; try { localStorage.setItem('flowriter-theme', n); } catch (err) {} t.innerHTML = n === 'dark' ? IC.sun : IC.moon; dispatchEvent(new Event('fw-theme')); $$('[data-chart]').forEach(drawChart); break; }
    case 'logout': if (api.logout) api.logout(); setSession(null); state.launch = null; go(''); break;
    case 'portrait-ok': document.body.classList.add('portrait-ok'); break;
    case 'quick-login': { const f = $('form[data-form="login"]'); if (f) { f.id.value = t.dataset.u; f.password.value = t.dataset.p; submitForm('login', f); } else { const u = await api.login(t.dataset.u, t.dataset.p); setSession(u, true); go(u.role === 'teacher' ? 'teach' : 'home'); } break; }
    case 'role': { const r = t.dataset.role; $('input[name="role"]').value = r; $$('[data-act="role"]').forEach(b => b.setAttribute('aria-pressed', String(b === t))); $('#suStudent').hidden = r !== 'student'; $('#suTeacher').hidden = r !== 'teacher'; break; }
    case 'guest-demo': launch({ engine: 'freeplay', role: 'guest', start: 'write', source: 'free', eyebrow: 'Guest demo · Free Play', title: 'Write “hello” to the beat', word: 'hello', bpm: 84, bps: 1, songId: 'sg_sunny', back: '', backLabel: 'Back to FloWriter' }); break;
    case 'back': go(state.launch ? state.launch.back : 'home'); break;
    case 'nav': go(t.dataset.to); break;
    case 'open-assignment': openAssignment(id); break;
    case 'open-lesson': openLesson(id); break;
    case 'preview': e.stopPropagation(); { const s = DB.songs.find(s => s.id === id); const r = await Music.preview(s, RUNTIME.songFiles[id]); $$('.disc').forEach(d => { const on = d.dataset.id === r; d.classList.toggle('on', on); d.innerHTML = on ? IC.pause : IC.play; }); } break;
    case 'pick-song': { state.play.songId = id; const s = DB.songs.find(s => s.id === id); state.play.text = pick(Math.random, FREE_TEXTS[s.mood || 'bright']); if (s.bpm > 110) state.play.bps = 2; rerender(); break; }
    case 'text-mode': state.play.textMode = t.dataset.mode; rerender(); break;
    case 'shuffle': { const s = DB.songs.find(s => s.id === state.play.songId) || DB.songs[0]; const pool = FREE_TEXTS[s.mood || 'bright'].concat(Object.values(FREE_TEXTS).flat()).filter(x => x !== state.play.text); state.play.text = pick(Math.random, pool); rerender(); break; }
    case 'bps': state.play.bps = +t.dataset.n; rerender(); break;
    case 'start-free': { const P = state.play, s = DB.songs.find(s => s.id === P.songId), text = cleanText(P.textMode === 'own' ? P.own : P.text); if (!text) return;
      launch({ engine: 'freeplay', role: 'student', start: 'write', source: 'free', eyebrow: 'Free Play', title: text.length > 40 ? text.slice(0, 38) + '…' : text, word: text, bpm: s.bpm, bps: P.bps, songId: s.id, back: 'play', backLabel: 'Back to Free Play' }); break; }
    case 'freewrite': launch({ engine: 'freeplay', role: 'teacher', source: 'free', eyebrow: 'Free Play', title: 'Free write', word: null, back: 'play', backLabel: 'Back to Free Play' }); break;
    case 'range': state.stats.range = t.dataset.k; rerender(); break;
    case 'scope': state.stats.scope = t.dataset.k; rerender(); break;
    case 'teach-tab': state.teach.tab = t.dataset.k; rerender(); break;
    case 'student': studentDrawer(id); break;
    case 'copy-code': { const c = $('#codeTxt').textContent; try { await navigator.clipboard.writeText(c); toast(`Copied ${c}`); } catch (err) { toast(`Class code: ${c}`); } break; }
    case 'regen-code': { const c = api.regenCode(state.teach.classId); rerender(); toast(`New class code: <span class="big">${c}</span> The old one stops working.`); break; }
    case 'archive-class': { const c = DB.classes.find(c => c.id === state.teach.classId); api.archiveClass(c.id, !c.archived); rerender(); toast(c.archived ? 'Period archived' : 'Period restored'); break; }
    case 'new-class': openOverlay(`<form class="modal" data-form="new-class" novalidate><h2>Add a class period</h2><div class="field"><label for="ncName">Name</label><input class="input" id="ncName" name="name" placeholder="Period 7 · 3rd grade" required></div><p class="note">We’ll make a 6-character code students use to join.</p><p class="form-error" role="alert"></p><div class="row"><button class="btn primary" type="submit">Create period</button><button class="btn" type="button" data-act="close-overlay">Cancel</button></div></form>`, true); break;
    case 'remove-student': { const k = DB.users.find(u => u.id === id); if (!confirm(`Remove ${k.name} from this period? Their history stays with their account.`)) return; api.removeStudent(id); closeOverlay(); rerender(); toast(`${esc(k.name)} removed`); break; }
    case 'extend': api.extendAssignment(id, 2); rerender(); toast('Due date moved 2 days later'); break;
    case 'delete-a': { const a = DB.assignments.find(a => a.id === id); if (!confirm(`Delete “${a.title}”? Students lose it from their to-do list.`)) return; api.deleteAssignment(id); rerender(); toast('Assignment deleted'); break; }
    case 'preview-a': openAssignment(id, true); break;
    case 'as-kind': case 'as-diff': { const name = act === 'as-kind' ? 'kind' : 'difficulty'; $(`input[name="${name}"]`).value = t.dataset.v; $$(`[data-act="${act}"]`).forEach(b => b.setAttribute('aria-pressed', String(b === t))); break; }
    case 'as-lesson': $('#asText').value = t.dataset.text; if (!$('#asTitle').value) $('#asTitle').value = t.textContent; break;
    case 'as-song': if (e.target.closest('.disc')) return; pickAsSong(id); break;
    case 'as-preview': { const a = readAssignForm(); if (!a) return; const d = DIFF[a.difficulty];
      launch({ engine: 'assignment', role: 'teacher', source: 'assignment', eyebrow: 'Preview · Assignment setup', title: a.title, lessonName: a.title, word: a.text, bpm: a.bpm, songId: a.songId, bps: d.bps, tol: d.tol, difficulty: a.difficulty, due: a.due, preview: true, back: 'teach', backLabel: 'Back to class' }); break; }
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act],tr[data-act]')) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.upload) handleUpload(t);
  else if (t.dataset.act === 'class-select') { state.teach.classId = t.value; go('teach?c=' + t.value); }
  else if (t.dataset.act === 'rank-class') { state.teach.classId = t.value; go('ranks?c=' + t.value); }
  else if (t.dataset.act === 'as-module') $('#asLessons').innerHTML = lessonChips(t.value);
  else if (t.dataset.act === 'as-class') { const kids = classStudents(t.value); $('#asKids').innerHTML = kids.map(k => `<label class="check"><input type="checkbox" name="kid" value="${k.id}"> ${esc(k.name)}</label>`).join('') || '<span class="note">No students in this period yet.</span>'; }
  else if (t.name === 'kid' && t.checked) { const r = $('input[name="target"][value="some"]'); r && (r.checked = true); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'password' && t.closest('form') && t.closest('form').querySelector('.rules') && (t.name === 'password')) paintRules(t);
  if (t.id === 'fpOwn') { const c = t.value.replace(/[^A-Za-z.,!?' \n]/g, ''); if (c !== t.value) t.value = c; state.play.own = t.value; const b = $('[data-act="start-free"]'); b && (b.disabled = !cleanText(t.value)); }
});
document.addEventListener('submit', e => {
  const f = e.target, name = f.dataset.form; if (!name) return; e.preventDefault();
  if (name === 'assign') { const a = readAssignForm(); if (!a) return; api.saveAssignment(a); state.teach.classId = a.classId; state.teach.tab = 'assignments'; toast(a.id ? 'Assignment updated' : `Assigned “${esc(a.title)}”`); go('teach?c=' + a.classId); return; }
  if (name === 'new-class') { const n = f.name.value.trim(); if (!n) { f.querySelector('.form-error').textContent = 'Name the period.'; return; } const c = api.addClass(state.user, n); closeOverlay(); state.teach.classId = c.id; go('teach?c=' + c.id); setTimeout(() => toast(`Created ${esc(c.name)} · code <span class="big">${c.code}</span>`, 5000), 50); return; }
  submitForm(name, f);
});

// Boot. With a backend configured, the Supabase session is the source of
// truth and the first render waits for it; otherwise this is the demo DB.
if (typeof Backend !== 'undefined' && Backend.enabled) {
  Backend.boot()
    .catch(e => {
      console.error('[flowriter] boot', e);
      // a bad URL/key, an offline network or a blocked CDN lands here: say so
      // plainly rather than showing an empty page
      setTimeout(() => toast('Could not reach the FloWriter server. Check config.js and your connection.', 8000), 400);
    })
    .then(() => render());
} else {
  restoreSession();
  render();
}

</script>
